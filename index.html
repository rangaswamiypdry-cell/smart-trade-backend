<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TRADE INDIA V2</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#071121;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:30px;
}

header{
 background:#122238;
 padding:25px 18px;
 border-bottom:1px solid #293b53;
}

header h1{
 color:#00d6a0;
 font-size:27px;
 margin:0;
}

header p{
 color:#a3b2c7;
 font-size:15px;
}

.container{
 padding:18px;
}

.status{
 background:#103128;
 color:#00d6a0;
 padding:18px;
 border-radius:15px;
 margin-bottom:20px;
 font-size:16px;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.stat{
 background:#15253b;
 border:2px solid #263a53;
 border-radius:20px;
 padding:25px;
}

.stat small{
 color:#9aaac0;
 font-size:15px;
}

.stat h2{
 margin:15px 0 0;
 font-size:35px;
}

.blue{color:#50a9ff}
.green{color:#00d6a0}
.red{color:#ff5279}
.yellow{color:#ffce57}

button{
 border:0;
 border-radius:14px;
 padding:18px;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}

.scan{
 width:100%;
 background:#00bd8b;
 color:#061b19;
 margin:22px 0;
 font-size:22px;
 padding:23px;
}

.search{
 width:100%;
 padding:20px;
 background:#15253b;
 border:2px solid #293d57;
 border-radius:15px;
 color:white;
 font-size:17px;
 margin-bottom:20px;
}

.filters{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:25px;
}

.filter{
 background:#263951;
 color:white;
}

.filter.active{
 background:#00b88b;
}

.section-title{
 font-size:23px;
 margin:25px 0 18px;
}

.card{
 background:#15253b;
 border:2px solid #263b56;
 border-radius:22px;
 padding:22px;
 margin-bottom:18px;
}

.card-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.card-head h2{
 font-size:25px;
 margin:0;
}

.badge{
 background:#463a19;
 color:#ffd45e;
 padding:12px;
 border-radius:10px;
 font-weight:bold;
}

.badge.buy{
 background:#064b3c;
 color:#00e2a4;
}

.badge.sell{
 background:#511d32;
 color:#ff6385;
}

.price{
 font-size:34px;
 font-weight:bold;
 margin:22px 0;
}

.metrics{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.metric{
 background:#0c192c;
 border-radius:14px;
 padding:17px;
 min-width:0;
}

.metric small{
 display:block;
 color:#91a3ba;
 margin-bottom:10px;
 font-size:14px;
}

.metric strong{
 font-size:19px;
 overflow-wrap:anywhere;
}

.footer{
 text-align:center;
 color:#8494aa;
 margin-top:45px;
 line-height:1.6;
}

.empty{
 background:#15253b;
 padding:35px 10px;
 text-align:center;
 border-radius:15px;
 color:#9baac0;
 font-size:19px;
}

@media(max-width:380px){
 .stat{padding:17px}
 .metric{padding:12px}
 .price{font-size:28px}
}
</style>
</head>

<body>

<header>
<h1>🚀 SMART TRADE INDIA</h1>
<p>PRO SCANNER V2 | NSE F&O | 5 MINUTE</p>
</header>

<div class="container">

<div class="status" id="status">
🟡 Connecting to Server...
</div>

<div class="stats">

<div class="stat">
<small>TOTAL STOCKS</small>
<h2 class="blue" id="total">0</h2>
</div>

<div class="stat">
<small>STRONG BUY</small>
<h2 class="green" id="buys">0</h2>
</div>

<div class="stat">
<small>STRONG SELL</small>
<h2 class="red" id="sells">0</h2>
</div>

<div class="stat">
<small>BTST</small>
<h2 class="yellow" id="btst">0</h2>
</div>

</div>

<button class="scan" id="scanBtn" onclick="startScan()">
🔄 START LIVE SCAN
</button>

<input
class="search"
id="search"
placeholder="🔎 Search Stock Name..."
oninput="renderStocks()"
>

<div class="filters">

<button class="filter active" onclick="setFilter('ALL',this)">ALL</button>

<button class="filter" onclick="setFilter('BUY',this)">BUY</button>

<button class="filter" onclick="setFilter('SELL',this)">SELL</button>

<button class="filter" onclick="setFilter('BTST',this)">BTST</button>

<button class="filter" onclick="setFilter('WAIT',this)">WAIT</button>

</div>

<h2 class="section-title" id="sectionTitle">
📊 All F&O Stocks
</h2>

<div id="stocks">
<div class="empty">Press START LIVE SCAN</div>
</div>

<div class="footer">
SMART TRADE INDIA V2<br>
Market Data Powered by Upstox API
</div>

</div>

<script>

// =================================
// BACKEND CONNECTION
// =================================

const API_BASE =
"https://smart-trade-backend-ig6l.onrender.com";

let stocks = [];
let currentFilter = "ALL";
let scanning = false;

// =================================
// API HELPER
// =================================

async function api(path){

 const response = await fetch(
 API_BASE + path,
 {
  method:"GET",
  cache:"no-store"
 }
 );

 const data = await response.json();

 if(!response.ok){
  throw new Error(
   data.error || data.message || "API Error " + response.status
  );
 }

 return data;
}

// =================================
// SERVER STATUS
// =================================

async function checkServer(){

 try{

  const data = await api("/health");

  if(!data.success){
   throw new Error("Server unavailable");
  }

  document.getElementById("status").innerHTML =
  "🟢 SERVER ONLINE | Instruments: " +
  data.instruments;

 }catch(error){

  document.getElementById("status").innerHTML =
  "🔴 SERVER ERROR: " + error.message;

 }

}

// =================================
// START SCANNER
// =================================

async function startScan(){

 if(scanning) return;

 scanning = true;

 const btn = document.getElementById("scanBtn");

 btn.disabled = true;
 btn.innerText = "⏳ SCANNING...";

 document.getElementById("status").innerText =
 "🟡 Scanning NSE F&O stocks...";

 try{

  const data = await api("/api/scan");

  if(!data.success){
   throw new Error(data.error || "Scan failed");
  }

  stocks = Array.isArray(data.signals)
   ? data.signals
   : [];

  updateStats();

  renderStocks();

  document.getElementById("status").innerHTML =
   "🟢 SCAN COMPLETED | Stocks: " + stocks.length;

 }catch(error){

  document.getElementById("status").innerHTML =
   "🔴 SCAN ERROR: " + error.message;

  document.getElementById("stocks").innerHTML =
   '<div class="empty">' +
   error.message +
   '</div>';

 }finally{

  scanning = false;

  btn.disabled = false;
  btn.innerText = "🔄 REFRESH SCANNER";

 }

}

// =================================
// UPDATE COUNTS
// =================================

function updateStats(){

 document.getElementById("total").innerText =
 stocks.length;

 document.getElementById("buys").innerText =
 stocks.filter(x =>
 x.signal.includes("BUY")
 ).length;

 document.getElementById("sells").innerText =
 stocks.filter(x =>
 x.signal.includes("SELL")
 ).length;

 document.getElementById("btst").innerText =
 stocks.filter(x => x.btst).length;

}

// =================================
// FILTER
// =================================

function setFilter(filter,button){

 currentFilter = filter;

 document.querySelectorAll(".filter")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 renderStocks();

}

// =================================
// FORMAT
// =================================

function money(value){

 return Number(value || 0).toFixed(2);

}

function signalClass(signal){

 if(signal.includes("BUY")) return "buy";

 if(signal.includes("SELL")) return "sell";

 return "";

}

// =================================
// RENDER STOCKS
// =================================

function renderStocks(){

 const search =
 document.getElementById("search")
 .value.toUpperCase();

 let filtered = stocks.filter(x=>{

  const signal = x.signal || "WAIT";

  const name = (x.symbol || "").toUpperCase();

  const searchMatch = name.includes(search);

  let filterMatch = true;

  if(currentFilter==="BUY")
   filterMatch = signal.includes("BUY");

  if(currentFilter==="SELL")
   filterMatch = signal.includes("SELL");

  if(currentFilter==="BTST")
   filterMatch = x.btst === true;

  if(currentFilter==="WAIT")
   filterMatch = signal === "WAIT";

  return searchMatch && filterMatch;

 });

 document.getElementById("sectionTitle").innerText =
 currentFilter === "BTST"
 ? "🟡 BTST Stocks"
 : currentFilter === "BUY"
 ? "🟢 Strong Buy Stocks"
 : currentFilter === "SELL"
 ? "🔴 Strong Sell Stocks"
 : currentFilter === "WAIT"
 ? "🟡 Waiting Stocks"
 : "📊 All F&O Stocks";

 if(!filtered.length){

  document.getElementById("stocks").innerHTML =
  '<div class="empty">No Signals Found</div>';

  return;

 }

 document.getElementById("stocks").innerHTML =
 filtered.map(stock=>{

  const signal = stock.signal || "WAIT";

  return `

  <div class="card">

   <div class="card-head">

    <h2>${stock.symbol || "UNKNOWN"}</h2>

    <span class="badge ${signalClass(signal)}">
     ${signal}
    </span>

   </div>

   <div class="price">
    ₹${money(stock.price)}
    <span style="font-size:17px;color:${
     stock.changePercent >= 0
      ? "#00d6a0"
      : "#ff5279"
    }">
     ${stock.changePercent >= 0 ? "+" : ""}
     ${money(stock.changePercent)}%
    </span>
   </div>

   <div class="metrics">

    ${metric("RSI 14",money(stock.rsi))}

    ${metric("EMA 20","₹"+money(stock.ema20))}

    ${metric("VWAP","₹"+money(stock.vwap))}

    ${metric("VOLUME RATIO",money(stock.volumeRatio)+"x")}

    ${metric("OI CHANGE",
      stock.oiChange === null
       ? "N/A"
       : money(stock.oiChange)+"%"
    )}

    ${metric("BREAKOUT",
      stock.breakout ? "YES" : "NO"
    )}

    ${metric("ENTRY","₹"+money(stock.entry))}

    ${metric("STOP LOSS","₹"+money(stock.stopLoss))}

    ${metric("TARGET","₹"+money(stock.target))}

    ${metric("BTST",stock.btst ? "YES" : "NO")}

    ${metric("SUPPORT","₹"+money(stock.support))}

    ${metric("RESISTANCE","₹"+money(stock.resistance))}

   </div>

   <div style="
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #34465e;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
   ">

    <span>5 MIN CANDLE</span>

    <span style="color:#00d6a0">
     ${stock.candleConfirmed
      ? "✅ CONFIRMED"
      : "⏳ WAITING"}
    </span>

   </div>

  </div>

  `;

 }).join("");

}

function metric(label,value){

 return `
 <div class="metric">
  <small>${label}</small>
  <strong>${value}</strong>
 </div>
 `;

}

// =================================
// INITIAL SERVER CHECK
// =================================

checkServer();

</script>

</body>
</html>
