<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Market Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #071426;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  color: #20d6a0;
  font-size: 28px;
}

.subtitle {
  color: #aab8ca;
  margin-bottom: 22px;
}

button {
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 12px;
  background: #12bd91;
  color: white;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 18px;
}

.card {
  background: #172a43;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 18px;
}

.card h2 {
  margin-top: 0;
}

.number {
  font-size: 38px;
  color: #20d6a0;
  font-weight: bold;
}

.stock {
  background: #172a43;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 14px;
  border-left: 5px solid #20d6a0;
}

.stock h3 {
  color: #20d6a0;
  font-size: 21px;
}

.stock p {
  font-size: 14px;
  color: #d5dfeb;
  line-height: 1.8;
}

.buy {
  color: #20d6a0;
  font-weight: bold;
}

.wait {
  color: orange;
}

.error {
  background: #3c1c2a;
  padding: 15px;
  border-radius: 12px;
  color: #ff7373;
  margin-bottom: 15px;
}

.section-title {
  color: #20d6a0;
  font-size: 23px;
  margin-top: 30px;
}

.footer {
  text-align: center;
  color: #8393a8;
  padding: 25px;
}
</style>
</head>

<body>

<h1>📈 Smart Market Scanner</h1>

<div class="subtitle">
NSE F&O | BTST | Strong Momentum Scanner
</div>

<button onclick="refreshScanner()">
🔄 REFRESH SCANNER
</button>

<div id="error"></div>

<div class="card">
<h2>Total Stocks Scanned</h2>
<div class="number" id="total">0</div>
</div>

<div class="card">
<h2>⭐ STRONG BUY</h2>
<div class="number" id="strong">0</div>
</div>

<div class="card">
<h2>🟢 BUY CANDIDATES</h2>
<div class="number" id="candidates">0</div>
</div>

<h2 class="section-title">
⭐ STRONG BUY STOCKS
</h2>

<div id="strongStocks">
Loading...
</div>

<h2 class="section-title">
🟢 BUY CANDIDATES
</h2>

<div id="candidateStocks">
Loading...
</div>

<div class="footer">
Smart Trade India<br>
NSE F&O BTST Scanner
</div>

<script>

const API =
"https://smart-trade-backend-ig6l.onrender.com";

function displayStocks(stocks, container) {

  const element = document.getElementById(container);

  if (!stocks || stocks.length === 0) {

    element.innerHTML =
      '<div class="card">No Stocks Found</div>';

    return;
  }

  element.innerHTML = stocks.map(stock => `

    <div class="stock">

      <h3>
        🟢 ${stock.symbol}
      </h3>

      <p>
        Signal:
        <b class="buy">${stock.signal}</b>
        <br>

        Price:
        ₹${stock.price}
        <br>

        Price Change:
        ${stock.price_change_percent}%
        <br>

        Volume:
        ${Number(stock.volume).toLocaleString("en-IN")}
        <br>

        Volume Change:
        ${stock.volume_change_percent}%
        <br>

        Volume Ratio:
        ${stock.volume_ratio}x
        <br>

        OI:
        ${Number(stock.oi).toLocaleString("en-IN")}
        <br>

        OI Change:
        ${stock.oi_change}%
        <br>

        RSI:
        ${stock.rsi14}
        <br>

        EMA 20:
        ₹${stock.ema20}
        <br>

        Resistance:
        ₹${stock.resistance}
        <br>

        Breakout:
        ${stock.breakout ? "✅ YES" : "❌ NO"}
        <br>

        Expiry:
        ${stock.expiry}
        <br>

        Candle:
        ${stock.candle_date}
      </p>

    </div>

  `).join("");

}

async function refreshScanner() {

  const errorBox = document.getElementById("error");

  errorBox.innerHTML = "";

  document.getElementById("strongStocks").innerHTML =
    "Scanning NSE F&O Stocks...";

  document.getElementById("candidateStocks").innerHTML =
    "Scanning...";

  try {

    const response = await fetch(
      API + "/api/btst/scan"
    );

    if (!response.ok) {

      throw new Error("HTTP ERROR " + response.status);

    }

    const data = await response.json();

    if (!data.success) {

      throw new Error(data.error || "Scanner Failed");

    }

    const stocks = data.results || [];

    const strongStocks = stocks.filter(
      x => x.signal === "STRONG_BUY"
    );

    const candidates = stocks.filter(
      x => x.signal === "BUY_CANDIDATE"
    );

    document.getElementById("total").innerText =
      data.scanned;

    document.getElementById("strong").innerText =
      strongStocks.length;

    document.getElementById("candidates").innerText =
      candidates.length;

    displayStocks(
      strongStocks,
      "strongStocks"
    );

    displayStocks(
      candidates,
      "candidateStocks"
    );

  } catch(error) {

    errorBox.innerHTML = `
      <div class="error">
        ❌ Scanner Error: ${error.message}
      </div>
    `;

    document.getElementById("strongStocks").innerHTML =
      "Unable to load stocks";

    document.getElementById("candidateStocks").innerHTML =
      "Unable to load stocks";

  }

}

refreshScanner();

</script>

</body>
</html>
