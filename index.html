<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Trade India - 52 Week Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    background: #0b1220;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.header {
    background: linear-gradient(135deg,#123b70,#126b75);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 15px;
}

.header h2 {
    margin: 0;
    font-size: 23px;
}

.header p {
    color: #c9e8ff;
    font-size: 12px;
}

.status {
    text-align: center;
    font-size: 12px;
    color: #9caec5;
    margin-bottom: 12px;
}

.controls {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

button, select {
    border: none;
    border-radius: 9px;
    padding: 13px 8px;
    font-weight: bold;
    font-size: 13px;
}

select {
    flex: 1;
    background: #1e293b;
    color: white;
}

button {
    background: #00b894;
    color: white;
    cursor: pointer;
}

.refresh {
    background: #2563eb;
}

.summary {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.box {
    background: #172338;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #293b55;
}

.box small {
    color: #aabbd0;
}

.box h2 {
    margin: 8px 0 0;
    font-size: 25px;
}

.green {
    color: #00e6a0;
}

.red {
    color: #ff6262;
}

.yellow {
    color: #ffc857;
}

.tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-bottom: 15px;
}

.tabs button {
    background: #26364e;
    white-space: nowrap;
}

.tabs button.active {
    background: #087f5b;
}

.search {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #34465f;
    background: #172338;
    color: white;
    margin-bottom: 14px;
}

.stock {
    background: #172338;
    border: 1px solid #30415a;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 13px;
}

.stock-header {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
}

.stock-name {
    font-size: 17px;
    font-weight: bold;
}

.badge {
    font-size: 11px;
    font-weight: bold;
    padding: 7px 9px;
    border-radius: 7px;
}

.strong {
    background: #064e3b;
    color: #4dffb0;
}

.watch {
    background: #59410a;
    color: #ffd166;
}

.wait {
    background: #344054;
    color: #cbd5e1;
}

.stock-info {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.info {
    background: #101b2c;
    padding: 10px;
    border-radius: 8px;
}

.info small {
    display: block;
    color: #94a8c1;
    font-size: 11px;
    margin-bottom: 5px;
}

.info strong {
    font-size: 14px;
}

.target {
    color: #00e6a0;
}

.stop {
    color: #ff7070;
}

.high {
    color: #ffd166;
}

.footer {
    text-align: center;
    color: #71839d;
    font-size: 11px;
    margin: 20px 0;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #64b5ff;
}

.error {
    color: #ff7070;
    text-align: center;
    padding: 15px;
}

@media(min-width:700px) {
    body {
        max-width: 900px;
        margin: auto;
    }

    .stock-info {
        grid-template-columns: repeat(4,1fr);
    }

    .summary {
        grid-template-columns: repeat(4,1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <h2>🚀 SMART TRADE INDIA</h2>
    <p>52 WEEK HIGH MOMENTUM SCANNER V2</p>
    <p>NSE ALL STOCKS + NSE F&O</p>
</div>

<div class="status" id="status">
    Connecting to scanner...
</div>

<div class="controls">

    <select id="market">
        <option value="ALL">NSE ALL STOCKS</option>
        <option value="FNO">NSE F&O STOCKS</option>
    </select>

    <button class="refresh" onclick="refreshScanner()">
        ↻ REFRESH
    </button>

</div>

<div class="summary">

    <div class="box">
        <small>Total Scanned</small>
        <h2 id="total">0</h2>
    </div>

    <div class="box">
        <small>STRONG BUY</small>
        <h2 class="green" id="strong">0</h2>
    </div>

    <div class="box">
        <small>BUY WATCH</small>
        <h2 class="yellow" id="watch">0</h2>
    </div>

    <div class="box">
        <small>WAIT</small>
        <h2 id="wait">0</h2>
    </div>

</div>

<div class="tabs">

    <button class="active" onclick="setFilter('ALL',this)">
        ALL SIGNALS
    </button>

    <button onclick="setFilter('STRONG BUY',this)">
        STRONG BUY
    </button>

    <button onclick="setFilter('BUY WATCH',this)">
        BUY WATCH
    </button>

    <button onclick="setFilter('WAIT',this)">
        WAIT
    </button>

    <button onclick="setFilter('TOUCH',this)">
        52W TOUCH
    </button>

    <button onclick="setFilter('BREAKOUT',this)">
        BREAKOUT
    </button>

</div>

<input
    type="text"
    id="search"
    class="search"
    placeholder="🔍 Search stock name..."
    oninput="renderStocks()"
>

<div id="results">
    <div class="loading">Loading Stocks...</div>
</div>

<div class="footer">
    SMART TRADE INDIA V2<br>
    Signals are for research purposes only.
    Verify price and risk before trading.
</div>

<script>

// ==========================================
// API CONFIGURATION
// ==========================================

const API_BASE =
"https://smart-trade-backend-ig6l.onrender.com";

let stocks = [];

let currentFilter = "ALL";

let loading = false;

// ==========================================
// LOAD SCANNER
// ==========================================

async function loadScanner() {

    if (loading) return;

    loading = true;

    document.getElementById("status").innerText =
        "Connecting to Upstox scanner...";

    document.getElementById("results").innerHTML =
        '<div class="loading">Please wait... Scanning stocks</div>';

    const market =
        document.getElementById("market").value;

    try {

        const response = await fetch(
            API_BASE +
            "/api/scanner/52week?type=" +
            market +
            "&limit=100"
        );

        if (!response.ok) {
            throw new Error("Server Error: " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Scanner failed");
        }

        stocks = data.data || [];

        document.getElementById("total").innerText =
            data.totalScanned || 0;

        document.getElementById("strong").innerText =
            data.strongBuy || 0;

        document.getElementById("watch").innerText =
            data.buyWatch || 0;

        document.getElementById("wait").innerText =
            data.wait || 0;

        document.getElementById("status").innerText =
            "✅ Connected | Last Scan: " +
            new Date(data.updatedAt).toLocaleString("en-IN");

        renderStocks();

    } catch(error) {

        document.getElementById("status").innerText =
            "❌ Connection Failed";

        document.getElementById("results").innerHTML =
            '<div class="error">' +
            error.message +
            '<br><br>Check Render server and Upstox token.' +
            '</div>';

    } finally {

        loading = false;

    }
}

// ==========================================
// REFRESH SCANNER
// ==========================================

async function refreshScanner() {

    if (loading) return;

    document.getElementById("status").innerText =
        "Refreshing scanner...";

    try {

        const response = await fetch(
            API_BASE + "/api/scanner/refresh"
        );

        if (!response.ok) {
            throw new Error("Refresh failed");
        }

        await loadScanner();

    } catch(error) {

        document.getElementById("status").innerText =
            "Refresh failed: " + error.message;

    }
}

// ==========================================
// FILTER BUTTONS
// ==========================================

function setFilter(filter, button) {

    currentFilter = filter;

    document.querySelectorAll(".tabs button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderStocks();
}

// ==========================================
// RENDER STOCKS
// ==========================================

function renderStocks() {

    const search =
        document.getElementById("search")
        .value.toUpperCase();

    let filtered = stocks.filter(stock => {

        const matchSearch =
            (stock.symbol || "").toUpperCase().includes(search) ||
            (stock.name || "").toUpperCase().includes(search);

        let matchFilter = true;

        if (currentFilter === "TOUCH") {
            matchFilter = stock.touch52Week;
        }

        else if (currentFilter === "BREAKOUT") {
            matchFilter = stock.breakout52Week;
        }

        else if (currentFilter !== "ALL") {
            matchFilter = stock.signal === currentFilter;
        }

        return matchSearch && matchFilter;

    });

    const container =
        document.getElementById("results");

    if (!filtered.length) {

        container.innerHTML =
            '<div class="loading">No stocks found</div>';

        return;
    }

    container.innerHTML = filtered.map(stock => {

        let badge = "wait";

        if (stock.signal === "STRONG BUY") {
            badge = "strong";
        }

        else if (stock.signal === "BUY WATCH") {
            badge = "watch";
        }

        return `

        <div class="stock">

            <div class="stock-header">

                <div>
                    <div class="stock-name">
                        ${escapeHTML(stock.symbol)}
                    </div>

                    <small style="color:#91a7c3">
                        ${escapeHTML(stock.market || "NSE")}
                    </small>
                </div>

                <span class="badge ${badge}">
                    ${escapeHTML(stock.signal)}
                </span>

            </div>

            <div class="stock-info">

                <div class="info">
                    <small>Current Price</small>
                    <strong>₹${format(stock.price)}</strong>
                </div>

                <div class="info">
                    <small>52 Week High</small>
                    <strong class="high">
                        ₹${format(stock.high52)}
                    </strong>
                </div>

                <div class="info">
                    <small>Distance From High</small>
                    <strong>${format(stock.distance52)}%</strong>
                </div>

                <div class="info">
                    <small>RSI (14)</small>
                    <strong>${format(stock.RSI)}</strong>
                </div>

                <div class="info">
                    <small>EMA 20</small>
                    <strong>₹${format(stock.EMA20)}</strong>
                </div>

                <div class="info">
                    <small>Volume Ratio</small>
                    <strong>${format(stock.volumeRatio)}x</strong>
                </div>

                <div class="info">
                    <small>BUY ENTRY</small>
                    <strong>₹${format(stock.entry)}</strong>
                </div>

                <div class="info">
                    <small>TARGET 1</small>
                    <strong class="target">
                        ₹${format(stock.target1)}
                    </strong>
                </div>

                <div class="info">
                    <small>TARGET 2</small>
                    <strong class="target">
                        ₹${format(stock.target2)}
                    </strong>
                </div>

                <div class="info">
                    <small>STOP LOSS</small>
                    <strong class="stop">
                        ₹${format(stock.stopLoss)}
                    </strong>
                </div>

                <div class="info">
                    <small>52W TOUCH</small>
                    <strong>
                        ${stock.touch52Week ? "YES" : "NO"}
                    </strong>
                </div>

                <div class="info">
                    <small>BREAKOUT</small>
                    <strong>
                        ${stock.breakout52Week ? "YES" : "NO"}
                    </strong>
                </div>

            </div>

        </div>

        `;

    }).join("");

}

// ==========================================
// SAFE HTML OUTPUT
// ==========================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ==========================================
// NUMBER FORMAT
// ==========================================

function format(value) {

    const number = Number(value);

    return Number.isFinite(number)
        ? number.toFixed(2)
        : "--";
}

// ==========================================
// MARKET CHANGE
// ==========================================

document.getElementById("market")
    .addEventListener("change", () => {

        stocks = [];

        currentFilter = "ALL";

        document.querySelectorAll(".tabs button")
            .forEach(btn => btn.classList.remove("active"));

        document.querySelector(".tabs button")
            .classList.add("active");

        loadScanner();

    });

// ==========================================
// START
// ==========================================

loadScanner();

</script>

</body>
</html>
