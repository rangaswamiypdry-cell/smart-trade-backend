<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Trade India - Swing Scanner</title><style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#0b1220;
 color:#fff;
 font-family:Arial,sans-serif;
}

.header{
 background:#17243a;
 padding:18px;
 border-radius:12px;
 margin-bottom:15px;
}

.header h2{
 margin:0;
 color:#32d6a0;
}

.header p{
 color:#aab8ce;
 margin-bottom:0;
 font-size:13px;
}

.status{
 margin-top:10px;
 font-size:13px;
 color:#32d6a0;
}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:15px;
}

button,select,input{
 padding:12px;
 border:none;
 border-radius:7px;
 font-size:14px;
}

button{
 background:#168b68;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button.secondary{
 background:#263850;
}

input,select{
 background:#1c2b42;
 color:white;
 border:1px solid #40516b;
}

.cards{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 margin-bottom:15px;
}

.card{
 background:#17243a;
 padding:15px;
 border-radius:10px;
}

.card small{
 color:#9eacc1;
}

.card h2{
 margin:8px 0 0;
 font-size:25px;
}

.green{color:#32d6a0}
.red{color:#ff6565}
.yellow{color:#ffcc66}

.section-title{
 margin:20px 0 10px;
 font-size:18px;
}

.stock{
 background:#17243a;
 border:1px solid #2b3c55;
 border-radius:10px;
 padding:15px;
 margin-bottom:12px;
}

.stock-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.stock-name{
 font-size:17px;
 font-weight:bold;
}

.badge{
 padding:6px 9px;
 border-radius:5px;
 font-size:11px;
 font-weight:bold;
}

.strong{background:#075c42;color:#70ffd0}
.buy{background:#15518b;color:#a8d8ff}
.wait{background:#6a4a12;color:#ffe09a}

.price{
 font-size:23px;
 font-weight:bold;
 margin:12px 0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.item{
 background:#0e192b;
 padding:9px;
 border-radius:6px;
}

.item small{
 display:block;
 color:#94a5bd;
 font-size:11px;
}

.item b{
 display:block;
 margin-top:5px;
 font-size:14px;
}

.conditions{
 margin-top:12px;
 font-size:12px;
 line-height:1.9;
 color:#b9c9dc;
}

.footer{
 color:#8293aa;
 font-size:11px;
 margin-top:12px;
}

#message{
 background:#17243a;
 padding:12px;
 border-radius:8px;
 margin-bottom:12px;
 font-size:13px;
}

@media(min-width:700px){
 body{max-width:1000px;margin:auto}
 .cards{grid-template-columns:repeat(4,1fr)}
 .grid{grid-template-columns:repeat(4,1fr)}
}
</style></head><body><div class="header">
 <h2>📈 SMART TRADE INDIA</h2>
 <p>NSE SHORT TERM SWING SCANNER V3</p>
 <p>1–5 Days | Technical Momentum | Daily Candles</p>
 <div class="status" id="connection">● Connecting...</div>
</div><div class="controls">
 <button onclick="runScanner()">🔄 SCAN NOW</button> <select id="limit">
  <option value="50">50 Stocks</option>
  <option value="100" selected>100 Stocks</option>
  <option value="200">200 Stocks</option>
  <option value="300">300 Stocks</option>
 </select> <select id="minScore">
  <option value="65">Score 65+</option>
  <option value="70" selected>Score 70+</option>
  <option value="80">Score 80+</option>
  <option value="85">Score 85+</option>
 </select><button class="secondary" onclick="nextBatch()">NEXT STOCKS ➜</button>

</div><input
id="search"
type="text"
placeholder="🔍 Search NSE Stock..."
style="width:100%;margin-bottom:15px"
oninput="renderStocks()"

«»

<div id="message">Waiting for scanner...</div><div class="cards">
 <div class="card">
  <small>Stocks Checked</small>
  <h2 id="checked">0</h2>
 </div> <div class="card">
  <small>STRONG BUY</small>
  <h2 class="green" id="strongCount">0</h2>
 </div> <div class="card">
  <small>BUY</small>
  <h2 class="green" id="buyCount">0</h2>
 </div> <div class="card">
  <small>WAIT</small>
  <h2 class="yellow" id="waitCount">0</h2>
 </div>
</div><h3 class="section-title">🚀 STRONG BUY SIGNALS</h3>
<div id="strongList"></div><h3 class="section-title">📈 BUY SIGNALS</h3>
<div id="buyList"></div><h3 class="section-title">📊 ALL SCANNED STOCKS</h3>
<div id="allList"></div><div class="footer" id="updated">
Last updated: Not scanned
</div><script>

// ============================================
// API CONFIGURATION
// ============================================

const API_BASE =
"https://smart-trade-backend-ig6l.onrender.com";

let allStocks = [];
let currentOffset = 0;
let lastScanData = null;
let loading = false;

// ============================================
// CONNECTION CHECK
// ============================================

async function checkConnection(){

 try{

  const response = await fetch(
   API_BASE + "/health"
  );

  if(!response.ok) throw new Error("Server error");

  const data = await response.json();

  document.getElementById("connection").innerHTML =
   "● SERVER CONNECTED";

 }catch(error){

  document.getElementById("connection").innerHTML =
   "● SERVER CONNECTION FAILED";

 }

}

// ============================================
// SCAN
// ============================================

async function runScanner(){

 if(loading) return;

 loading = true;

 const limit =
 Number(document.getElementById("limit").value);

 const minScore =
 Number(document.getElementById("minScore").value);

 const message =
 document.getElementById("message");

 message.innerHTML =
 "⏳ Scanning NSE stocks... Please wait.";

 document.getElementById("strongList").innerHTML = "";
 document.getElementById("buyList").innerHTML = "";
 document.getElementById("allList").innerHTML = "";

 try{

  const apiURL =
   `${API_BASE}/api/stocks/swing-scan` +
   `?limit=${limit}` +
   `&minScore=${minScore}` +
   `&offset=${currentOffset}`;

  const response = await fetch(apiURL);

  const data = await response.json();

  if(!response.ok || !data.success){

   throw new Error(data.error || "Scanner failed");

  }

  lastScanData = data;

  allStocks = data.all_results || [];

  document.getElementById("checked").innerText =
   data.checked ?? 0;

  document.getElementById("strongCount").innerText =
   data.strong_buy_count ?? 0;

  document.getElementById("buyCount").innerText =
   data.buy_count ?? 0;

  document.getElementById("waitCount").innerText =
   data.wait_count ?? 0;

  document.getElementById("strongList").innerHTML =
   makeStockCards(data.strong_buy || []);

  document.getElementById("buyList").innerHTML =
   makeStockCards(data.buy || []);

  renderStocks();

  message.innerHTML =
   `✅ Scan Completed | ${data.checked} stocks checked | ` +
   `Total NSE stocks: ${data.total_nse_stocks}`;

  document.getElementById("updated").innerText =
   "Last updated: " + new Date().toLocaleString();

 }catch(error){

  message.innerHTML =
   "❌ ERROR: " + escapeHTML(error.message);

 }finally{

  loading = false;

 }

}

// ============================================
// NEXT BATCH
// ============================================

function nextBatch(){

 const limit =
 Number(document.getElementById("limit").value);

 const total =
 lastScanData?.total_nse_stocks || 0;

 if(total && currentOffset + limit >= total){

  currentOffset = 0;

  alert("Last batch completed. Starting from first batch.");

 }else{

  currentOffset += limit;

 }

 runScanner();

}

// ============================================
// RENDER ALL STOCKS
// ============================================

function renderStocks(){

 const search =
 document.getElementById("search").value.toUpperCase();

 const filtered = allStocks.filter(stock =>

  String(stock.symbol || "")
   .toUpperCase()
   .includes(search)

 );

 document.getElementById("allList").innerHTML =
  makeStockCards(filtered);

}

// ============================================
// STOCK CARDS
// ============================================

function makeStockCards(stocks){

 if(!stocks.length){

  return `<div class="stock">No stocks found.</div>`;

 }

 return stocks.map(stock => {

  let badge = "wait";

  if(stock.signal === "STRONG_BUY") badge = "strong";
  else if(stock.signal === "BUY") badge = "buy";

  return `

  <div class="stock">

   <div class="stock-head">

    <div class="stock-name">
     ${escapeHTML(stock.symbol || "-")}
    </div>

    <span class="badge ${badge}">
     ${escapeHTML(stock.signal || "WAIT")}
    </span>

   </div>

   <div class="footer">
    ${escapeHTML(stock.name || "")}
   </div>

   <div class="price">
    ₹${format(stock.price)}
    <span class="${Number(stock.change_percent)>=0?'green':'red'}"
     style="font-size:13px">
     ${Number(stock.change_percent)>=0?'+':''}
     ${format(stock.change_percent)}%
    </span>
   </div>

   <div class="grid">

    <div class="item">
     <small>ENTRY PRICE</small>
     <b>₹${format(stock.entry_price)}</b>
    </div>

    <div class="item">
     <small>STOP LOSS</small>
     <b class="red">₹${format(stock.stop_loss)}</b>
    </div>

    <div class="item">
     <small>TARGET 1</small>
     <b class="green">₹${format(stock.target1)}</b>
    </div>

    <div class="item">
     <small>TARGET 2</small>
     <b class="green">₹${format(stock.target2)}</b>
    </div>

    <div class="item">
     <small>MOMENTUM SCORE</small>
     <b>${format(stock.momentum_score)}/100</b>
    </div>

    <div class="item">
     <small>RSI 14</small>
     <b>${format(stock.rsi14)}</b>
    </div>

    <div class="item">
     <small>ADX 14</small>
     <b>${format(stock.adx14)}</b>
    </div>

    <div class="item">
     <small>VOLUME RATIO</small>
     <b>${format(stock.volume_ratio)}x</b>
    </div>

    <div class="item">
     <small>EMA 20</small>
     <b>₹${format(stock.ema20)}</b>
    </div>

    <div class="item">
     <small>EMA 50</small>
     <b>₹${format(stock.ema50)}</b>
    </div>

    <div class="item">
     <small>3 DAY MOMENTUM</small>
     <b class="green">${format(stock.momentum_3day)}%</b>
    </div>

    <div class="item">
     <small>RISK / REWARD</small>
     <b>${format(stock.risk_reward)} R</b>
    </div>

    <div class="item">
     <small>SUPPORT</small>
     <b>₹${format(stock.support)}</b>
    </div>

    <div class="item">
     <small>RESISTANCE</small>
     <b>₹${format(stock.resistance)}</b>
    </div>

    <div class="item">
     <small>MACD</small>
     <b>${format(stock.macd)}</b>
    </div>

    <div class="item">
     <small>VOLUME</small>
     <b>${Number(stock.volume || 0).toLocaleString("en-IN")}</b>
    </div>

   </div>

   <div class="conditions">

    <b>Technical Conditions</b><br>

    ${condition(stock.conditions?.aboveEMA20,"Above EMA20")}
    ${condition(stock.conditions?.emaBullish,"EMA20 > EMA50")}
    ${condition(stock.conditions?.rsiStrong,"RSI Strong")}
    ${condition(stock.conditions?.adxStrong,"ADX Strong")}
    ${condition(stock.conditions?.macdBullish,"MACD Bullish")}
    ${condition(stock.conditions?.volumeStrong,"Volume Strong")}
    ${condition(stock.conditions?.priceMomentum,"Price Momentum")}
    ${condition(stock.conditions?.bullishCandle,"Bullish Candle")}
    ${condition(stock.conditions?.strongBreakout,"Breakout")}

   </div>

   <div class="footer">
    Holding: ${escapeHTML(stock.holding_period || "1-5 DAYS")}
    <br>
    Fundamentals: ${escapeHTML(stock.fundamental_status || "NOT_VERIFIED")}
    <br>
    Candle: ${escapeHTML(stock.candle_time || "-")}
   </div>

  </div>

  `;

 }).join("");

}

// ============================================
// CONDITION DISPLAY
// ============================================

function condition(value,label){

 return `
  <span style="color:${value?'#32d6a0':'#ff7777'}">
   ${value?'✔':'✖'} ${label}
  </span>
  &nbsp;
 `;

}

// ============================================
// SAFE FORMATTING
// ============================================

function format(value){

 const n = Number(value);

 return Number.isFinite(n)
  ? n.toFixed(2)
  : "-";

}

function escapeHTML(value){

 return String(value ?? "").replace(
  /[&<>"']/g,
  char => ({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[char]
 );

}

// ============================================
// START
// ============================================

checkConnection();

runScanner();

</script></body>
</html>
