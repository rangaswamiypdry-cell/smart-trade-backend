<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Trade India - Swing Scanner</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0b1120;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #151f33;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 15px;
    border: 1px solid #263650;
}

header h2 {
    margin: 0;
    color: #38bdf8;
}

header p {
    color: #94a3b8;
    font-size: 12px;
}

input, select, button {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #172338;
    color: white;
    margin: 4px 0;
}

input {
    width: 100%;
}

button {
    cursor: pointer;
    background: #2563eb;
    border: none;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.controls {
    background: #151f33;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: #151f33;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #263650;
}

.stat small {
    color: #94a3b8;
}

.stat h2 {
    margin: 8px 0 0;
}

.green { color: #22c55e; }
.red { color: #ef4444; }
.yellow { color: #facc15; }
.blue { color: #38bdf8; }

.status {
    padding: 12px;
    border-radius: 8px;
    background: #172338;
    margin-bottom: 15px;
    font-size: 13px;
    color: #cbd5e1;
    overflow-wrap: anywhere;
}

.stock {
    background: #151f33;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 13px;
    border: 1px solid #263650;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
}

.stock h3 {
    margin: 0;
    color: #fff;
}

.badge {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
}

.strong {
    background: #14532d;
    color: #4ade80;
}

.buy {
    background: #064e3b;
    color: #34d399;
}

.wait {
    background: #713f12;
    color: #fde047;
}

.avoid {
    background: #7f1d1d;
    color: #fca5a5;
}

.price {
    font-size: 23px;
    font-weight: bold;
    margin: 15px 0;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.detail {
    background: #0b1120;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
}

.detail small {
    color: #94a3b8;
    display: block;
    margin-bottom: 5px;
}

.detail b {
    font-size: 14px;
}

.score {
    margin-top: 12px;
    background: #0b1120;
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
}

.score div {
    height: 100%;
    background: #22c55e;
}

.filters {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
}

.filters select {
    flex: 1;
    min-width: 130px;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    padding: 20px;
}

@media(min-width:700px) {
    .stats {
        grid-template-columns: repeat(4, 1fr);
    }

    #results {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
}
</style></head><body><header>
    <h2>🚀 SMART TRADE INDIA</h2>
    <p>SHORT TERM SWING SCANNER V2 | NSE EQUITY</p>
    <p>DAILY + 5 MINUTE MOMENTUM ANALYSIS</p>
</header><div class="controls"><label>Backend Render URL</label>

<input
    id="apiUrl"
    type="url"
    placeholder="https://your-backend.onrender.com"
>

<button onclick="saveURL()" style="width:100%">
    SAVE BACKEND URL
</button>

<div style="display:flex;gap:8px;margin-top:10px">

    <button id="scanBtn"
        onclick="startScan()"
        style="flex:1">
        🔍 START SCAN
    </button>

    <button onclick="stopAuto()"
        style="flex:1;background:#dc2626">
        STOP AUTO
    </button>

</div>

<div class="filters">

    <select id="signalFilter" onchange="renderStocks()">
        <option value="ALL">ALL SIGNALS</option>
        <option value="STRONG BUY">STRONG BUY</option>
        <option value="BUY">BUY</option>
        <option value="WAIT">WAIT</option>
        <option value="AVOID">AVOID</option>
    </select>

    <select id="sortFilter" onchange="renderStocks()">
        <option value="score">Highest Score</option>
        <option value="price">Highest Price</option>
        <option value="rsi">Highest RSI</option>
    </select>

</div>

<div style="display:flex;gap:8px">

    <button onclick="previousPage()" style="flex:1">
        ◀ PREVIOUS
    </button>

    <button onclick="nextPage()" style="flex:1">
        NEXT 100 ▶
    </button>

</div>

<button onclick="enableAuto()"
    style="width:100%;background:#0891b2;margin-top:8px">
    ⏱ AUTO REFRESH (5 MIN)
</button>

</div><div class="stats"><div class="stat">
    <small>SCANNED</small>
    <h2 id="total">0</h2>
</div>

<div class="stat">
    <small>STRONG BUY</small>
    <h2 class="green" id="strong">0</h2>
</div>

<div class="stat">
    <small>BUY</small>
    <h2 class="green" id="buy">0</h2>
</div>

<div class="stat">
    <small>ERRORS</small>
    <h2 class="red" id="errors">0</h2>
</div>

</div><div class="status" id="status">
    Waiting for scanner connection...
</div><h3>📊 SWING TRADING SIGNALS</h3><div id="results"></div><div class="footer">
    SMART TRADE INDIA<br>
    Daily + 5 Minute Scanner<br>
    Technical signals are not guaranteed returns.
</div><script>

// ======================================
// CONFIGURATION
// ======================================

let offset = 0;

const LIMIT = 100;

let stocks = [];

let autoTimer = null;

let scanning = false;

const savedURL = localStorage.getItem("swingAPI");

if (savedURL) {
    document.getElementById("apiUrl").value = savedURL;
}

// ======================================
// SAVE BACKEND URL
// ======================================

function saveURL() {

    const url = document
        .getElementById("apiUrl")
        .value.trim()
        .replace(/\/+$/, "");

    if (!url.startsWith("https://")) {
        alert("Enter valid HTTPS Render URL");
        return;
    }

    localStorage.setItem("swingAPI", url);

    alert("Backend URL Saved Successfully");
}

// ======================================
// START SCAN
// ======================================

async function startScan() {

    if (scanning) return;

    const baseURL = localStorage.getItem("swingAPI");

    if (!baseURL) {
        alert("First enter and save your Render URL");
        return;
    }

    scanning = true;

    const btn = document.getElementById("scanBtn");

    btn.disabled = true;

    btn.innerText = "SCANNING...";

    document.getElementById("status").innerText =
        "Connecting to Upstox backend...";

    document.getElementById("results").innerHTML = "";

    try {

        const response = await fetch(
            `${baseURL}/api/swing/scan?offset=${offset}&limit=${LIMIT}`
        );

        if (!response.ok) {
            throw new Error("Backend HTTP Error: " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Scanner failed");
        }

        stocks = data.signals || [];

        document.getElementById("total").innerText =
            data.scanned ?? 0;

        document.getElementById("strong").innerText =
            data.strongBuy ?? 0;

        document.getElementById("buy").innerText =
            data.buy ?? 0;

        document.getElementById("errors").innerText =
            (data.errors || []).length;

        document.getElementById("status").innerText =
            `Scan Complete | NSE Stocks: ${data.totalNSEStocks} | Scanned: ${data.scanned} | Offset: ${data.offset}`;

        renderStocks();

    } catch(error) {

        document.getElementById("status").innerText =
            "ERROR: " + error.message;

    } finally {

        scanning = false;

        btn.disabled = false;

        btn.innerText = "🔍 START SCAN";
    }
}

// ======================================
// RENDER STOCKS
// ======================================

function renderStocks() {

    const container = document.getElementById("results");

    container.innerHTML = "";

    const filter =
        document.getElementById("signalFilter").value;

    const sort =
        document.getElementById("sortFilter").value;

    let filtered = stocks.filter(s => {

        return filter === "ALL" || s.signal === filter;

    });

    filtered.sort((a,b) => {

        if (sort === "score") return b.score - a.score;

        if (sort === "price") return b.price - a.price;

        if (sort === "rsi") return b.daily.rsi - a.daily.rsi;

        return 0;
    });

    if (!filtered.length) {

        container.innerHTML =
            "<div class='status'>No matching stocks found.</div>";

        return;
    }

    filtered.forEach(stock => {

        const badge =
            stock.signal === "STRONG BUY" ? "strong" :
            stock.signal === "BUY" ? "buy" :
            stock.signal === "WAIT" ? "wait" : "avoid";

        const card = document.createElement("div");

        card.className = "stock";

        card.innerHTML = `

            <div class="stock-top">

                <h3>${escapeHTML(stock.symbol)}</h3>

                <span class="badge ${badge}">
                    ${escapeHTML(stock.signal)}
                </span>

            </div>

            <div style="color:#94a3b8;font-size:11px;margin-top:5px">
                ${escapeHTML(stock.name || "")}
            </div>

            <div class="price">
                ₹${Number(stock.price).toFixed(2)}
            </div>

            <div class="details">

                <div class="detail">
                    <small>ENTRY</small>
                    <b class="blue">₹${stock.entry}</b>
                </div>

                <div class="detail">
                    <small>STOP LOSS</small>
                    <b class="red">₹${stock.stopLoss}</b>
                </div>

                <div class="detail">
                    <small>TARGET 1</small>
                    <b class="green">₹${stock.target1}</b>
                </div>

                <div class="detail">
                    <small>TARGET 2</small>
                    <b class="green">₹${stock.target2}</b>
                </div>

                <div class="detail">
                    <small>DAILY RSI</small>
                    <b>${stock.daily.rsi}</b>
                </div>

                <div class="detail">
                    <small>5 MIN RSI</small>
                    <b>${stock.fiveMinute.rsi}</b>
                </div>

                <div class="detail">
                    <small>DAILY EMA 20</small>
                    <b>${stock.daily.ema20}</b>
                </div>

                <div class="detail">
                    <small>DAILY EMA 50</small>
                    <b>${stock.daily.ema50}</b>
                </div>

                <div class="detail">
                    <small>DAILY VOLUME RATIO</small>
                    <b>${stock.daily.volumeRatio}x</b>
                </div>

                <div class="detail">
                    <small>5 MIN VOLUME RATIO</small>
                    <b>${stock.fiveMinute.volumeRatio}x</b>
                </div>

            </div>

            <div style="margin-top:15px">
                <small style="color:#94a3b8">
                    SIGNAL STRENGTH: ${stock.score}/100
                </small>

                <div class="score">
                    <div style="width:${Math.min(100,Math.max(0,stock.score))}%"></div>
                </div>
            </div>

            <div style="margin-top:12px;font-size:12px;color:#94a3b8">
                DAILY TREND: ${escapeHTML(stock.trend)}
                <br>
                5 MIN TREND: ${escapeHTML(stock.fiveMinute.trend)}
                <br>
                HOLDING: ${escapeHTML(stock.holdingPeriod)}
            </div>

        `;

        container.appendChild(card);

    });
}

// ======================================
// HTML ESCAPE
// ======================================

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);

}

// ======================================
// PAGINATION
// ======================================

function nextPage() {

    if (scanning) return;

    offset += LIMIT;

    startScan();
}

function previousPage() {

    if (scanning) return;

    offset = Math.max(0, offset - LIMIT);

    startScan();
}

// ======================================
// AUTO REFRESH
// ======================================

function enableAuto() {

    stopAuto();

    autoTimer = setInterval(() => {

        if (!scanning) startScan();

    }, 5 * 60 * 1000);

    alert("Auto Refresh Enabled: Every 5 Minutes");
}

function stopAuto() {

    if (autoTimer) {

        clearInterval(autoTimer);

        autoTimer = null;
    }

}

// ======================================
// INITIALIZATION
// ======================================

</script></body>
 </html>
