<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Trade India - ORB Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1220;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    background: #111c30;
    padding: 18px;
    border-bottom: 1px solid #26364e;
}

header h2 {
    margin: 0;
    color: #35d399;
}

header p {
    color: #9caec5;
    font-size: 12px;
}

.container {
    padding: 12px;
    max-width: 1200px;
    margin: auto;
}

.status {
    background: #14243b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.online {
    color: #22c55e;
}

.offline {
    color: #ef4444;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

.stat {
    background: #17263d;
    padding: 15px;
    border-radius: 10px;
}

.stat small {
    color: #9caec5;
}

.stat h2 {
    margin: 8px 0 0;
}

.green {
    color: #22c55e;
}

.red {
    color: #ef4444;
}

.yellow {
    color: #facc15;
}

button {
    border: none;
    padding: 12px;
    border-radius: 7px;
    background: #263b59;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button.active {
    background: #0d9b69;
}

button:disabled {
    opacity: .5;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 15px 0;
}

.controls button {
    flex: 1;
    min-width: 90px;
}

.refresh {
    width: 100%;
    background: #087fce;
    margin: 10px 0;
}

.search {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #34465e;
    background: #17263d;
    color: white;
    margin-bottom: 12px;
}

.stock-card {
    background: #14243b;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: 1px solid #263b59;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.stock-name {
    font-size: 17px;
    font-weight: bold;
}

.badge {
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

.buy {
    background: #064e3b;
    color: #4ade80;
}

.sell {
    background: #7f1d1d;
    color: #fca5a5;
}

.wait {
    background: #493b13;
    color: #facc15;
}

.price {
    font-size: 24px;
    margin: 12px 0;
}

.details {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    font-size: 13px;
}

.details div {
    background: #1c304c;
    padding: 9px;
    border-radius: 6px;
}

.details span {
    color: #a9bad0;
    display: block;
    margin-bottom: 4px;
}

.trade-plan {
    margin-top: 12px;
    padding: 12px;
    background: #1b3048;
    border-radius: 8px;
}

.trade-plan h4 {
    margin: 0 0 10px;
    color: #38bdf8;
}

.trade-plan div {
    margin: 6px 0;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #38bdf8;
}

.error {
    background: #471d28;
    color: #fca5a5;
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #9caec5;
}

footer {
    text-align: center;
    padding: 20px;
    color: #71839d;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h2>SMART TRADE INDIA</h2>
    <p>ORB + VOLUME BREAKOUT SCANNER V1</p>
</header>

<div class="container">

    <div class="status">
        API STATUS:
        <b id="apiStatus" class="yellow">CHECKING...</b>
        <br><br>
        NSE MASTER:
        <b id="masterStatus">Loading...</b>
        <br><br>
        Last Scan:
        <span id="lastScan">--</span>
    </div>

    <div class="stats">

        <div class="stat">
            <small>Total Stocks</small>
            <h2 id="totalStocks">0</h2>
        </div>

        <div class="stat">
            <small>F&O Stocks</small>
            <h2 id="fnoStocks">0</h2>
        </div>

        <div class="stat">
            <small>STRONG BUY</small>
            <h2 class="green" id="buyCount">0</h2>
        </div>

        <div class="stat">
            <small>STRONG SELL</small>
            <h2 class="red" id="sellCount">0</h2>
        </div>

    </div>

    <div class="controls">

        <button class="active" onclick="selectType('ALL',this)">
            ALL NSE
        </button>

        <button onclick="selectType('FNO',this)">
            NSE F&O
        </button>

    </div>

    <div class="controls">

        <button class="active" onclick="selectSignal('ALL',this)">
            ALL
        </button>

        <button onclick="selectSignal('BUY',this)">
            🟢 BUY
        </button>

        <button onclick="selectSignal('SELL',this)">
            🔴 SELL
        </button>

        <button onclick="selectSignal('STRONG',this)">
            ⭐ STRONG
        </button>

    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search stock name..."
        oninput="renderStocks()"
    >

    <button class="refresh" onclick="loadScanner(true)">
        🔄 REFRESH SCANNER
    </button>

    <div id="message"></div>

    <div id="stockList">
        <div class="loading">Loading Scanner...</div>
    </div>

</div>

<footer>
    SMART TRADE INDIA<br>
    ORB + VOLUME BREAKOUT<br>
    Signals based on completed 5-minute candles.
</footer>

<script>

// ======================================
// BACKEND URL
// ======================================

const API =
"https://smart-trade-backend-ig6l.onrender.com";

// ======================================
// GLOBAL VARIABLES
// ======================================

let currentType = "FNO";

let currentSignal = "ALL";

let stocks = [];

let loading = false;

let lastData = null;

// ======================================
// API STATUS
// ======================================

async function checkStatus() {

    try {

        const response = await fetch(
            API + "/api/orb/status"
        );

        if (!response.ok) {
            throw new Error("API error " + response.status);
        }

        const data = await response.json();

        const status = document.getElementById("apiStatus");

        status.innerText =
            data.apiConnected &&
            data.instrumentsLoaded > 0
            ? "ONLINE"
            : "DATA NOT READY";

        status.className =
            data.apiConnected &&
            data.instrumentsLoaded > 0
            ? "online"
            : "offline";

        document.getElementById("masterStatus").innerText =
            "NSE: " + data.instrumentsLoaded +
            " | F&O: " + data.fnoStocks;

        document.getElementById("fnoStocks").innerText =
            data.fnoStocks;

        document.getElementById("totalStocks").innerText =
            data.instrumentsLoaded;

    } catch(error) {

        document.getElementById("apiStatus").innerText =
            "OFFLINE";

        document.getElementById("apiStatus").className =
            "offline";

        showError(error.message);

    }

}

// ======================================
// SELECT TYPE
// ======================================

function selectType(type, button) {

    currentType = type;

    document.querySelectorAll(".controls:first-of-type button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    loadScanner(true);

}

// ======================================
// SELECT SIGNAL
// ======================================

function selectSignal(type, button) {

    currentSignal = type;

    button.parentElement
        .querySelectorAll("button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderStocks();

}

// ======================================
// LOAD SCANNER
// ======================================

async function loadScanner(force = false) {

    if (loading) return;

    loading = true;

    const list = document.getElementById("stockList");

    const message = document.getElementById("message");

    list.innerHTML =
        '<div class="loading">Scanning NSE Stocks... Please wait.</div>';

    message.innerHTML = "";

    try {

        const response = await fetch(
            API + "/api/orb/scan?type=" + currentType
        );

        if (!response.ok) {

            throw new Error(
                "Scanner API Error: " + response.status
            );

        }

        const result = await response.json();

        if (!result.success) {

            throw new Error(
                result.error || "Scanner failed"
            );

        }

        lastData = result;

        stocks = result.data || [];

        document.getElementById("totalStocks").innerText =
            result.totalStocks ?? 0;

        document.getElementById("buyCount").innerText =
            result.bullish ?? 0;

        document.getElementById("sellCount").innerText =
            result.bearish ?? 0;

        document.getElementById("lastScan").innerText =
            new Date(result.scanTime).toLocaleTimeString();

        await checkStatus();

        renderStocks();

    } catch(error) {

        list.innerHTML = "";

        showError(error.message);

    } finally {

        loading = false;

    }

}

// ======================================
// RENDER STOCKS
// ======================================

function renderStocks() {

    const list = document.getElementById("stockList");

    const search =
        document.getElementById("search")
        .value.toUpperCase();

    let filtered = stocks.filter(stock => {

        const name =
            (stock.symbol || "") +
            " " +
            (stock.company || "");

        return name.toUpperCase().includes(search);

    });

    if (currentSignal === "BUY") {

        filtered = filtered.filter(
            x => x.signal === "STRONG BUY"
        );

    }

    if (currentSignal === "SELL") {

        filtered = filtered.filter(
            x => x.signal === "STRONG SELL"
        );

    }

    if (currentSignal === "STRONG") {

        filtered = filtered.filter(
            x =>
                x.volumeRatio >= 2 &&
                (
                    x.signal === "STRONG BUY"
                    ? x.rsi >= 65
                    : x.signal === "STRONG SELL"
                    ? x.rsi <= 35
                    : false
                )
        );

    }

    if (!filtered.length) {

        list.innerHTML =
            '<div class="empty">No matching breakout signals found.</div>';

        return;

    }

    list.innerHTML = filtered.map(stock => {

        const isBuy = stock.signal === "STRONG BUY";

        const isSell = stock.signal === "STRONG SELL";

        const badgeClass =
            isBuy ? "buy" :
            isSell ? "sell" : "wait";

        return `

        <div class="stock-card">

            <div class="stock-top">

                <div class="stock-name">
                    ${escapeHTML(stock.symbol)}
                </div>

                <span class="badge ${badgeClass}">
                    ${escapeHTML(stock.signal)}
                </span>

            </div>

            <div class="price">
                ₹${format(stock.price)}
            </div>

            <div class="details">

                <div>
                    <span>ORB HIGH</span>
                    ₹${format(stock.orbHigh)}
                </div>

                <div>
                    <span>ORB LOW</span>
                    ₹${format(stock.orbLow)}
                </div>

                <div>
                    <span>VOLUME RATIO</span>
                    ${format(stock.volumeRatio)}x
                </div>

                <div>
                    <span>VOLUME BREAKOUT</span>
                    ${stock.volumeBreakout ? "YES" : "NO"}
                </div>

                <div>
                    <span>RSI 14</span>
                    ${format(stock.rsi)}
                </div>

                <div>
                    <span>VWAP</span>
                    ₹${format(stock.vwap)}
                </div>

                <div>
                    <span>EMA 20</span>
                    ₹${format(stock.ema20)}
                </div>

                <div>
                    <span>CANDLE</span>
                    ${escapeHTML(
                        new Date(stock.candleTime)
                        .toLocaleTimeString()
                    )}
                </div>

            </div>

            <div class="trade-plan">

                <h4>TRADE SETUP</h4>

                <div>
                    Entry:
                    <b>₹${format(stock.entry)}</b>
                </div>

                <div>
                    Stop Loss:
                    <b class="red">
                        ₹${format(stock.stopLoss)}
                    </b>
                </div>

                <div>
                    Target 1:
                    <b class="green">
                        ₹${format(stock.target1)}
                    </b>
                </div>

                <div>
                    Target 2:
                    <b class="green">
                        ₹${format(stock.target2)}
                    </b>
                </div>

                <div>
                    Risk Reward:
                    <b>${stock.riskReward || "--"}</b>
                </div>

            </div>

        </div>

        `;

    }).join("");

}

// ======================================
// SAFE HTML
// ======================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

// ======================================
// NUMBER FORMAT
// ======================================

function format(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {

        return "--";

    }

    return Number(value).toFixed(2);

}

// ======================================
// ERROR
// ======================================

function showError(error) {

    document.getElementById("message").innerHTML =

        '<div class="error">' +
        escapeHTML(error) +
        '</div>';

}

// ======================================
// INITIAL START
// ======================================

checkStatus();

loadScanner();

// Refresh every 60 seconds

setInterval(() => {

    checkStatus();

}, 60000);

setInterval(() => {

    loadScanner();

}, 60000);

</script>

</body>
</html>
