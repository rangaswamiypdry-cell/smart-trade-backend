<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Smart Trade India V2</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: #ffffff;
}

header {
    background: #101d30;
    padding: 18px;
    border-bottom: 1px solid #263750;
}

header h2 {
    margin: 0;
    color: #00e5a0;
    font-size: 22px;
}

header p {
    color: #9aabc2;
    margin: 7px 0 0;
    font-size: 12px;
}

.container {
    padding: 14px;
    max-width: 1200px;
    margin: auto;
}

.status {
    background: #112b27;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 13px;
    color: #00e5a0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 18px;
}

.stat-card {
    background: #142238;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #263750;
}

.stat-card small {
    color: #9aabc2;
    font-size: 12px;
}

.stat-card h2 {
    margin: 10px 0 0;
    font-size: 25px;
}

.green { color: #00e5a0; }
.red { color: #ff526b; }
.blue { color: #48a8ff; }
.yellow { color: #ffca50; }

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 11px 15px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    background: #263750;
    color: white;
}

button.active {
    background: #00a879;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

.scan-btn {
    width: 100%;
    padding: 15px;
    background: #00b982;
    color: #001b15;
    font-size: 15px;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #263750;
    background: #142238;
    color: white;
    border-radius: 8px;
    margin-bottom: 15px;
    outline: none;
}

.section-title {
    font-size: 17px;
    margin: 20px 0 12px;
}

.stock-card {
    background: #142238;
    border: 1px solid #293c57;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.stock-name {
    font-size: 19px;
    font-weight: bold;
}

.signal {
    font-size: 11px;
    padding: 7px 9px;
    border-radius: 6px;
    font-weight: bold;
    background: #263750;
}

.signal.buy {
    background: #064b37;
    color: #00ffad;
}

.signal.sell {
    background: #531e2b;
    color: #ff657c;
}

.signal.wait {
    background: #42371a;
    color: #ffd36b;
}

.stock-price {
    font-size: 23px;
    margin-top: 12px;
    font-weight: bold;
}

.stock-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 15px;
}

.detail {
    background: #0d192a;
    padding: 10px;
    border-radius: 7px;
}

.detail small {
    color: #91a4bf;
    font-size: 11px;
}

.detail strong {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.stock-footer {
    border-top: 1px solid #293c57;
    margin-top: 14px;
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
}

.empty {
    background: #142238;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    color: #9aabc2;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #71849d;
    font-size: 12px;
}

@media(min-width:700px) {

    .stats {
        grid-template-columns: repeat(4, 1fr);
    }

    .stock-details {
        grid-template-columns: repeat(4, 1fr);
    }

    #stocks {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

}

</style>

</head>

<body>

<header>

<h2>🚀 SMART TRADE INDIA</h2>

<p>PRO SCANNER V2 | NSE F&O | 5 MINUTE</p>

</header>

<div class="container">

<div class="status" id="status">
● Connecting to Server...
</div>

<div class="stats">

<div class="stat-card">
<small>TOTAL STOCKS</small>
<h2 id="total" class="blue">0</h2>
</div>

<div class="stat-card">
<small>STRONG BUY</small>
<h2 id="buy" class="green">0</h2>
</div>

<div class="stat-card">
<small>STRONG SELL</small>
<h2 id="sell" class="red">0</h2>
</div>

<div class="stat-card">
<small>BTST</small>
<h2 id="btst" class="yellow">0</h2>
</div>

</div>

<button class="scan-btn" id="scanBtn"
onclick="startScan()">

🔍 START LIVE SCAN

</button>

<input
type="text"
id="search"
placeholder="🔎 Search Stock Name..."
oninput="renderStocks()">

<div class="buttons">

<button class="active"
onclick="changeTab('ALL',this)">
ALL
</button>

<button onclick="changeTab('BUY',this)">
BUY
</button>

<button onclick="changeTab('SELL',this)">
SELL
</button>

<button onclick="changeTab('BTST',this)">
BTST
</button>

<button onclick="changeTab('WAIT',this)">
WAIT
</button>

</div>

<h3 class="section-title" id="sectionTitle">
📊 All F&O Stocks
</h3>

<div id="stocks">

<div class="empty">
Press START LIVE SCAN
</div>

</div>

</div>

<div class="footer">

SMART TRADE INDIA V2<br>
Market Data Powered by Upstox API

</div>

<script>

// ======================================
// SERVER CONNECTION
// ======================================

const API_URL =
"https://smart-trade-backend-ig6l.onrender.com";

let stockData = [];

let currentTab = "ALL";

let scanning = false;

// ======================================
// API REQUEST
// ======================================

async function apiRequest(path) {

    const response = await fetch(
        API_URL + path,
        {
            cache: "no-store",
            signal: AbortSignal.timeout(90000)
        }
    );

    if (!response.ok) {

        throw new Error(
            "Server Error: " + response.status
        );

    }

    return await response.json();

}

// ======================================
// SERVER STATUS
// ======================================

async function checkServer() {

    try {

        const data = await apiRequest("/health");

        document.getElementById("status").innerHTML =
        "🟢 SERVER ONLINE | Instruments: " +
        data.instruments;

    }

    catch(error) {

        document.getElementById("status").innerHTML =
        "🔴 SERVER CONNECTION FAILED";

    }

}

// ======================================
// START SCANNER
// ======================================

async function startScan() {

    if (scanning) return;

    scanning = true;

    const btn = document.getElementById("scanBtn");

    btn.disabled = true;

    btn.innerText = "⏳ SCANNING...";

    document.getElementById("status").innerText =
    "Scanning NSE F&O stocks...";

    try {

        const data = await apiRequest("/api/scan");

        if (!data.success) {

            throw new Error(
                data.error || "Scan failed"
            );

        }

        stockData = data.signals || [];

        updateStats();

        renderStocks();

        document.getElementById("status").innerText =
        "🟢 SCAN COMPLETE | " +
        stockData.length +
        " STOCKS | " +
        new Date().toLocaleTimeString();

    }

    catch(error) {

        document.getElementById("status").innerText =
        "🔴 ERROR: " + error.message;

    }

    finally {

        scanning = false;

        btn.disabled = false;

        btn.innerText = "🔄 REFRESH SCANNER";

    }

}

// ======================================
// STATISTICS
// ======================================

function updateStats() {

    document.getElementById("total").innerText =
    stockData.length;

    document.getElementById("buy").innerText =
    stockData.filter(x =>
        x.signal.includes("BUY")
    ).length;

    document.getElementById("sell").innerText =
    stockData.filter(x =>
        x.signal.includes("SELL")
    ).length;

    document.getElementById("btst").innerText =
    stockData.filter(x => x.btst).length;

}

// ======================================
// CHANGE TAB
// ======================================

function changeTab(tab, button) {

    currentTab = tab;

    document.querySelectorAll(".buttons button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    const titles = {
        ALL: "📊 All F&O Stocks",
        BUY: "🟢 Buy Signals",
        SELL: "🔴 Sell Signals",
        BTST: "🟡 BTST Stocks",
        WAIT: "⏳ Waiting Stocks"
    };

    document.getElementById("sectionTitle").innerText =
    titles[tab];

    renderStocks();

}

// ======================================
// RENDER STOCKS
// ======================================

function renderStocks() {

    const search =
    document.getElementById("search")
        .value.toUpperCase().trim();

    let filtered = stockData.filter(stock => {

        const symbol = String(
            stock.symbol || ""
        ).toUpperCase();

        const matchesSearch =
        symbol.includes(search);

        let matchesTab = true;

        if (currentTab === "BUY") {
            matchesTab =
            stock.signal.includes("BUY");
        }

        if (currentTab === "SELL") {
            matchesTab =
            stock.signal.includes("SELL");
        }

        if (currentTab === "BTST") {
            matchesTab = stock.btst === true;
        }

        if (currentTab === "WAIT") {
            matchesTab =
            stock.signal === "WAIT";
        }

        return matchesSearch && matchesTab;

    });

    const container =
    document.getElementById("stocks");

    if (!filtered.length) {

        container.innerHTML =
        `<div class="empty">
        No Signals Found
        </div>`;

        return;

    }

    container.innerHTML = filtered.map(stock => {

        const signal = stock.signal || "WAIT";

        let signalClass = "wait";

        if (signal.includes("BUY")) {
            signalClass = "buy";
        }

        if (signal.includes("SELL")) {
            signalClass = "sell";
        }

        const priceChange =
        Number(stock.changePercent || 0);

        const changeColor =
        priceChange >= 0 ? "green" : "red";

        const oi =
        stock.oiChange === null
        ? "N/A"
        : stock.oiChange + "%";

        return `

        <div class="stock-card">

            <div class="stock-top">

                <div class="stock-name">
                    ${stock.symbol}
                </div>

                <div class="signal ${signalClass}">
                    ${signal}
                </div>

            </div>

            <div class="stock-price">
                ₹${Number(stock.price).toFixed(2)}

                <span class="${changeColor}"
                style="font-size:13px">

                ${priceChange.toFixed(2)}%

                </span>
            </div>

            <div class="stock-details">

                <div class="detail">
                    <small>RSI 14</small>
                    <strong>${Number(stock.rsi).toFixed(2)}</strong>
                </div>

                <div class="detail">
                    <small>EMA 20</small>
                    <strong>₹${Number(stock.ema20).toFixed(2)}</strong>
                </div>

                <div class="detail">
                    <small>VWAP</small>
                    <strong>₹${Number(stock.vwap).toFixed(2)}</strong>
                </div>

                <div class="detail">
                    <small>VOLUME RATIO</small>
                    <strong>${Number(stock.volumeRatio).toFixed(2)}x</strong>
                </div>

                <div class="detail">
                    <small>OI CHANGE</small>
                    <strong>${oi}</strong>
                </div>

                <div class="detail">
                    <small>BREAKOUT</small>
                    <strong>${stock.breakout ? "YES" : "NO"}</strong>
                </div>

                <div class="detail">
                    <small>ENTRY</small>
                    <strong>₹${Number(stock.entry).toFixed(2)}</strong>
                </div>

                <div class="detail">
                    <small>STOP LOSS</small>
                    <strong class="red">
                    ₹${Number(stock.stopLoss).toFixed(2)}
                    </strong>
                </div>

                <div class="detail">
                    <small>TARGET</small>
                    <strong class="green">
                    ₹${Number(stock.target).toFixed(2)}
                    </strong>
                </div>

                <div class="detail">
                    <small>BTST</small>
                    <strong class="yellow">
                    ${stock.btst ? "YES" : "NO"}
                    </strong>
                </div>

            </div>

            <div class="stock-footer">

                <span>
                    5 MIN CANDLE
                </span>

                <span>
                    ${stock.candleConfirmed
                    ? "✅ CONFIRMED"
                    : "WAITING"}
                </span>

            </div>

        </div>

        `;

    }).join("");

}

// ======================================
// AUTO REFRESH
// ======================================

// Refresh displayed data without
// starting another expensive market scan.

async function refreshSignals() {

    if (scanning) return;

    try {

        const data =
        await apiRequest("/api/signals");

        if (data.signals) {

            stockData = data.signals;

            updateStats();

            renderStocks();

        }

    }

    catch(error) {

        console.log(error.message);

    }

}

// ======================================
// INITIALIZE
// ======================================

async function initialize() {

    await checkServer();

    await refreshSignals();

}

initialize();

// Check server every 30 seconds.

setInterval(checkServer, 30000);

// Refresh latest stored signals every 30 seconds.

setInterval(refreshSignals, 30000);

</script>

</body>

 </html>
