
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TRADE INDIA V12 PRO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  background:#151e32;
  padding:18px 14px;
  border-bottom:2px solid #263957;
}
h2{margin:0;color:#42e8b5}
.sub{color:#aab8ce;font-size:12px;margin-top:7px}
.container{padding:12px;max-width:1100px;margin:auto}
.toolbar{
 display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;
}
button{
 border:0;padding:11px 15px;border-radius:8px;
 background:#2378e8;color:white;font-weight:bold;
}
button.off{background:#536174}
.status{
 padding:12px;background:#17243b;border-radius:9px;
 margin:10px 0;font-size:13px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}
.card{
 background:#17243b;
 border:1px solid #304361;
 border-radius:12px;
 padding:13px;
 min-width:0;
}
.card h3{margin:0 0 10px;color:#42e8b5}
.signal{
 padding:9px;border-radius:7px;
 background:#293750;margin:9px 0;
 font-weight:bold;
}
.strong{background:#075e42;color:#fff}
.wait{background:#604b1b;color:#ffe49a}
.error{background:#722c38;color:#fff}
.metrics{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}
.metric{
 background:#101a2d;
 padding:9px;border-radius:7px;
}
.metric small{color:#9caec6;display:block;font-size:11px}
.metric b{display:block;margin-top:5px;font-size:15px;overflow-wrap:anywhere}
.checks{font-size:12px;line-height:2;color:#c4d3e9}
.good{color:#42e8b5}
.bad{color:#ff7777}
.footer{
 text-align:center;color:#8293ae;
 font-size:11px;padding:20px;
}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h2>SMART TRADE INDIA V12 PRO</h2>
<div class="sub">LIVE NSE INDEX OPTIONS SCANNER</div>
<div class="sub">NIFTY | BANKNIFTY | FINNIFTY | SENSEX</div>
</header>

<div class="container">

<div class="toolbar">
<button onclick="loadData()">REFRESH NOW</button>
<button id="soundBtn" class="off" onclick="toggleSound()">SOUND OFF</button>
</div>

<div class="status" id="connection">
Connecting to server...
</div>

<div class="status">
Last Scan: <b id="lastScan">Waiting...</b><br>
Next refresh: <b id="countdown">60</b> seconds
</div>

<div class="grid" id="dashboard">
<div class="card">Loading market data...</div>
</div>

<div class="footer">
SMART TRADE INDIA V12 PRO<br>
Upstox API | Completed 5 Minute Candle Scanner
</div>

</div>

<script>
"use strict";

// YOUR RENDER SERVER
const API = "https://smart-trade-backend-ig6l.onrender.com";

const INDEXES = [
 "NIFTY",
 "BANKNIFTY",
 "FINNIFTY",
 "SENSEX"
];

let soundEnabled = false;
let previousSignals = new Set();
let countdown = 60;

function number(v){
 if(v===null || v===undefined || !Number.isFinite(Number(v)))
 return "--";
 return Number(v).toLocaleString("en-IN",{
 maximumFractionDigits:2
 });
}

function checkSignal(checks){
 if(!checks) return {count:0,total:6,ready:false};

 const keys=[
  "trend","vwap","rsi","macd","volume","oiPrice"
 ];

 const count=keys.filter(k=>checks[k]===true).length;

 return {
  count,
  total:6,
  ready:count===6
 };
}

function makeSignal(name,side,checks){
 const result=checkSignal(checks);

 if(!result.ready){
  return `
  <div class="signal wait">
   ${side} SELL : WAIT (${result.count}/6)
  </div>`;
 }

 const key=name+"_"+side;

 if(!previousSignals.has(key)){
  playAlert();
  previousSignals.add(key);
 }

 return `
 <div class="signal strong">
  VERY STRONG ${side} SELL<br>
  ALL 6/6 CONDITIONS TRUE
 </div>`;
}

function metric(label,value){
 return `
 <div class="metric">
  <small>${label}</small>
  <b>${number(value)}</b>
 </div>`;
}

function renderIndex(name,d){
 if(!d){
  return `<div class="card">
   <h3>${name}</h3>
   <div class="signal error">NO DATA</div>
  </div>`;
 }

 if(d.status==="ERROR"){
  return `<div class="card">
   <h3>${name}</h3>
   <div class="signal error">ERROR</div>
   ${d.error || "Market data unavailable"}
  </div>`;
 }

 const pe=makeSignal(name,"PE",d.peChecks);
 const ce=makeSignal(name,"CE",d.ceChecks);

 return `
 <div class="card">
  <h3>${name}</h3>

  <div class="signal">
   STATUS: ${d.status || "WAIT"}
  </div>

  ${pe}
  ${ce}

  <div class="metrics">
   ${metric("Spot Price",d.underlyingPrice)}
   ${metric("Futures Price",d.futuresPrice)}
   ${metric("Candle Close",d.candleClose)}
   ${metric("RSI",d.rsi)}
   ${metric("VWAP",d.vwap)}
   ${metric("EMA 9",d.ema9)}
   ${metric("EMA 21",d.ema21)}
   ${metric("EMA 50",d.ema50)}
   ${metric("ADX",d.adx)}
   ${metric("ADR",d.adr)}
   ${metric("Volume",d.volume)}
   ${metric("Average Volume",d.averageVolume)}
   ${metric("Volume Multiplier",d.volumeMultiplier)}
   ${metric("Open Interest",d.oi)}
   ${metric("OI Change",d.oiChange)}
   ${metric("OI Change %",d.oiChangePercent)}
  </div>

  <div class="status">
   OI READY:
   <b class="${d.oiReady?'good':'bad'}">
   ${d.oiReady===true?"YES":"NO"}
   </b>
  </div>

  <div class="checks">
   <b>PE SELL CONDITIONS</b><br>
   ${showChecks(d.peChecks)}
   <br>
   <b>CE SELL CONDITIONS</b><br>
   ${showChecks(d.ceChecks)}
  </div>

  <div class="sub">
   Candle: ${d.candleTime || "--"}<br>
   Updated: ${d.timestamp || "--"}<br>
   Futures: ${d.futuresSymbol || "--"}<br>
   Strike: ${d.selectedStrike?.strikePrice || "--"}
  </div>
 </div>`;
}

function showChecks(checks){
 if(!checks) return "Checks unavailable";

 const keys=["trend","vwap","rsi","macd","volume","oiPrice"];

 return keys.map(k=>{
  const ok=checks[k]===true;
  return `<span class="${ok?'good':'bad'}">
   ${ok?'✓':'✗'} ${k}
  </span>`;
 }).join("<br>");
}

async function loadData(){
 const connection=document.getElementById("connection");

 connection.textContent="Connecting to V12 PRO server...";

 try{
  const response=await fetch(API+"/api/market",{
   cache:"no-store"
  });

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(data.status==="ERROR"){
   throw new Error(data.error || "Scanner error");
  }

  const results=data.results || {};

  document.getElementById("dashboard").innerHTML=
   INDEXES.map(name=>
    renderIndex(name,results[name])
   ).join("");

  document.getElementById("lastScan").textContent=
   data.lastScanTime || new Date().toLocaleTimeString();

  connection.innerHTML=
   '<span class="good">● SERVER CONNECTED</span> | '+
   (data.version || "V12 PRO");

 }catch(error){
  connection.innerHTML=
   '<span class="bad">● CONNECTION ERROR</span><br>'+
   error.message;
 }
}

function toggleSound(){
 soundEnabled=!soundEnabled;

 const btn=document.getElementById("soundBtn");

 btn.textContent=soundEnabled?"SOUND ON":"SOUND OFF";
 btn.className=soundEnabled?"":"off";

 if(soundEnabled) playAlert();
}

function playAlert(){
 if(!soundEnabled) return;

 try{
  const ctx=new (window.AudioContext || window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value=850;
  gain.gain.value=0.15;

  osc.start();
  osc.stop(ctx.currentTime+0.25);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

setInterval(()=>{
 countdown--;
 if(countdown<=0){
  countdown=60;
  loadData();
 }
 document.getElementById("countdown").textContent=countdown;
},1000);

loadData();
</script>

</body>
</html>
