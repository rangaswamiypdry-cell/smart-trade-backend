<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Trade India V2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #101e32;
    padding: 22px 18px;
    border-bottom: 1px solid #263950;
}

header h1 {
    margin: 0;
    color: #00d69b;
    font-size: 27px;
}

header p {
    color: #9baac0;
    margin-bottom: 0;
}

.container {
    padding: 20px 14px;
    max-width: 900px;
    margin: auto;
}

.status {
    background: #103027;
    color: #00d69b;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 22px;
}

.stat {
    background: #14243a;
    border: 2px solid #263950;
    border-radius: 22px;
    padding: 25px 18px;
}

.stat span {
    color: #9baac0;
    font-size: 17px;
}

.stat h2 {
    font-size: 38px;
    margin: 15px 0 0;
}

.blue { color: #49a5ff; }
.green { color: #00d69b; }
.red { color: #ff5377; }
.yellow { color: #ffca54; }

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.refresh {
    width: 100%;
    padding: 24px;
    border-radius: 15px;
    background: #00b98a;
    color: #07111f;
    font-size: 21px;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    background: #14243a;
    border: 2px solid #263950;
    padding: 22px;
    border-radius: 15px;
    font-size: 19px;
    color: white;
    margin-bottom: 25px;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 35px;
}

.filters button {
    padding: 20px 27px;
    background: #263950;
    color: white;
    border-radius: 14px;
    font-size: 18px;
}

.filters button.active {
    background: #00b98a;
    color: #07111f;
}

.section-title {
    font-size: 25px;
    margin: 30px 0 22px;
}

.card {
    background: #14243a;
    border: 2px solid #263950;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 22px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stock-name {
    font-size: 29px;
    font-weight: bold;
}

.signal {
    padding: 13px 17px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
}

.buy {
    background: #064e3b;
    color: #00e6a1;
}

.sell {
    background: #541b2b;
    color: #ff5578;
}

.wait {
    background: #49391a;
    color: #ffcf59;
}

.price {
    font-size: 35px;
    font-weight: bold;
    margin: 23px 0;
}

.change {
    font-size: 20px;
}

.metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.metric {
    background: #0c192c;
    padding: 18px;
    border-radius: 14px;
    min-width: 0;
}

.metric span {
    display: block;
    color: #899bb5;
    font-size: 16px;
    margin-bottom: 12px;
}

.metric strong {
    font-size: 20px;
    overflow-wrap: anywhere;
}

.positive {
    color: #00d69b;
}

.negative {
    color: #ff5578;
}

.confirm {
    border-top: 1px solid #33455e;
    padding-top: 20px;
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    font-size: 17px;
}

.empty {
    background: #14243a;
    padding: 50px 15px;
    text-align: center;
    color: #9baac0;
    border-radius: 20px;
    font-size: 21px;
}

footer {
    text-align: center;
    color: #71839c;
    padding: 35px 10px;
    font-size: 17px;
}

@media(max-width:380px) {
    .metric {
        padding: 13px;
    }

    .metric strong {
        font-size: 17px;
    }

    .filters button {
        padding: 16px 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚀 SMART TRADE INDIA</h1>
    <p>PRO SCANNER V2 | NSE F&O | 5 MINUTE</p>
</header>

<div class="container">

    <div class="status" id="status">
        🟢 Connecting to Server...
    </div>

    <div class="stats">

        <div class="stat">
            <span>TOTAL STOCKS</span>
            <h2 class="blue" id="total">0</h2>
        </div>

        <div class="stat">
            <span>STRONG BUY</span>
            <h2 class="green" id="buyCount">0</h2>
        </div>

        <div class="stat">
            <span>STRONG SELL</span>
            <h2 class="red" id="sellCount">0</h2>
        </div>

        <div class="stat">
            <span>BTST</span>
            <h2 class="yellow" id="btstCount">0</h2>
        </div>

    </div>

    <button class="refresh" id="scanBtn" onclick="scanStocks()">
        🔍 START LIVE SCAN
    </button>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="🔎 Search Stock Name..."
        oninput="renderStocks()"
    >

    <div class="filters">

        <button class="active" onclick="setFilter('ALL',this)">ALL</button>

        <button onclick="setFilter('BUY',this)">BUY</button>

        <button onclick="setFilter('SELL',this)">SELL</button>

        <button onclick="setFilter('BTST',this)">BTST</button>

        <button onclick="setFilter('WAIT',this)">WAIT</button>

    </div>

    <h2 class="section-title" id="sectionTitle">
        📊 All F&O Stocks
    </h2>

    <div id="stockList">
        <div class="empty">
            Press START LIVE SCAN
        </div>
    </div>

</div>

<footer>
    SMART TRADE INDIA V2<br>
    Market Data Powered by Upstox API
</footer>

<script>

// ==================================
// BACKEND CONFIGURATION
// ==================================

const API_BASE =
"https://smart-trade-backend-ig6l.onrender.com";

const SCAN_API =
API_BASE + "/api/options/nse-stocks/scan";

// ==================================
// GLOBAL DATA
// ==================================

let stocks = [];

let currentFilter = "ALL";

let scanning = false;

// ==================================
// FORMAT
// ==================================

function money(value) {

    return "₹" + Number(value || 0).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}

function number(value) {

    return Number(value || 0).toFixed(2);

}

// ==================================
// STATUS
// ==================================

function setStatus(message) {

    document.getElementById("status").innerText =
    message;

}

// ==================================
// SCAN STOCKS
// ==================================

async function scanStocks() {

    if (scanning) return;

    scanning = true;

    const btn = document.getElementById("scanBtn");

    btn.innerText = "⏳ SCANNING...";

    btn.disabled = true;

    setStatus("🟢 Scanning NSE F&O stocks...");

    try {

        const response = await fetch(SCAN_API, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {

            throw new Error("HTTP " + response.status);

        }

        const data = await response.json();

        if (!data.success) {

            throw new Error(data.message || "API Error");

        }

        stocks = Array.isArray(data.signals)
            ? data.signals
            : [];

        const total = Number(data.count ?? stocks.length);

        document.getElementById("total").innerText =
        total;

        updateStats();

        renderStocks();

        setStatus(
            "🟢 SERVER ONLINE | Instruments: " + total
        );

    }

    catch(error) {

        console.error(error);

        setStatus(
            "🔴 SERVER ERROR: " + error.message
        );

    }

    finally {

        scanning = false;

        btn.disabled = false;

        btn.innerText = "🔄 REFRESH SCANNER";

    }

}

// ==================================
// UPDATE COUNTS
// ==================================

function updateStats() {

    const buys = stocks.filter(s =>
        s.signal === "STRONG_BUY" ||
        s.signal === "BUY"
    ).length;

    const sells = stocks.filter(s =>
        s.signal === "STRONG_SELL" ||
        s.signal === "SELL"
    ).length;

    const btst = stocks.filter(s =>
        s.btst === true
    ).length;

    document.getElementById("buyCount").innerText =
    buys;

    document.getElementById("sellCount").innerText =
    sells;

    document.getElementById("btstCount").innerText =
    btst;

}

// ==================================
// FILTER
// ==================================

function setFilter(filter, button) {

    currentFilter = filter;

    document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderStocks();

}

// ==================================
// FILTER DATA
// ==================================

function getFilteredStocks() {

    const search =
    document.getElementById("search")
    .value.toUpperCase();

    return stocks.filter(stock => {

        const symbol =
        String(stock.symbol || "").toUpperCase();

        const signal =
        String(stock.signal || "WAIT").toUpperCase();

        const matchesSearch =
        symbol.includes(search);

        let matchesFilter = true;

        if (currentFilter === "BUY") {

            matchesFilter =
            signal === "BUY" ||
            signal === "STRONG_BUY";

        }

        else if (currentFilter === "SELL") {

            matchesFilter =
            signal === "SELL" ||
            signal === "STRONG_SELL";

        }

        else if (currentFilter === "BTST") {

            matchesFilter = stock.btst === true;

        }

        else if (currentFilter === "WAIT") {

            matchesFilter = signal === "WAIT";

        }

        return matchesSearch && matchesFilter;

    });

}

// ==================================
// RENDER STOCKS
// ==================================

function renderStocks() {

    const list =
    document.getElementById("stockList");

    const filtered = getFilteredStocks();

    const titles = {

        ALL: "📊 All F&O Stocks",

        BUY: "🟢 Strong Buy Stocks",

        SELL: "🔴 Strong Sell Stocks",

        BTST: "🟡 BTST Stocks",

        WAIT: "⏳ Waiting Stocks"

    };

    document.getElementById("sectionTitle").innerText =
    titles[currentFilter];

    if (filtered.length === 0) {

        list.innerHTML =
        '<div class="empty">No Signals Found</div>';

        return;

    }

    list.innerHTML = filtered.map(stock => {

        const signal =
        String(stock.signal || "WAIT").toUpperCase();

        const isBuy =
        signal === "BUY" ||
        signal === "STRONG_BUY";

        const isSell =
        signal === "SELL" ||
        signal === "STRONG_SELL";

        const signalClass =
        isBuy ? "buy" :
        isSell ? "sell" : "wait";

        const price =
        Number(stock.price || 0);

        const change =
        Number(stock.changePercent || 0);

        const changeClass =
        change >= 0 ? "positive" : "negative";

        const btst =
        stock.btst === true ? "YES" : "NO";

        return `

        <div class="card">

            <div class="card-top">

                <div class="stock-name">
                    ${stock.symbol || "UNKNOWN"}
                </div>

                <div class="signal ${signalClass}">
                    ${signal.replace("_"," ")}
                </div>

            </div>

            <div class="price">

                ${money(price)}

                <span class="change ${changeClass}">
                    ${number(change)}%
                </span>

            </div>

            <div class="metrics">

                <div class="metric">
                    <span>RSI 14</span>
                    <strong>${number(stock.rsi)}</strong>
                </div>

                <div class="metric">
                    <span>EMA 20</span>
                    <strong>${money(stock.ema20)}</strong>
                </div>

                <div class="metric">
                    <span>VWAP</span>
                    <strong>${money(stock.vwap)}</strong>
                </div>

                <div class="metric">
                    <span>VOLUME RATIO</span>
                    <strong>${number(stock.volumeRatio)}x</strong>
                </div>

                <div class="metric">
                    <span>OI CHANGE</span>
                    <strong>${number(stock.oiChange)}%</strong>
                </div>

                <div class="metric">
                    <span>BREAKOUT</span>
                    <strong>${stock.breakout ? "YES" : "NO"}</strong>
                </div>

                <div class="metric">
                    <span>ENTRY</span>
                    <strong>${money(stock.entry)}</strong>
                </div>

                <div class="metric">
                    <span>STOP LOSS</span>
                    <strong class="negative">
                        ${money(stock.stopLoss)}
                    </strong>
                </div>

                <div class="metric">
                    <span>TARGET</span>
                    <strong class="positive">
                        ${money(stock.target)}
                    </strong>
                </div>

                <div class="metric">
                    <span>BTST</span>
                    <strong class="yellow">
                        ${btst}
                    </strong>
                </div>

            </div>

            <div class="confirm">

                <span>5 MIN CANDLE</span>

                <span>
                    ${stock.candleConfirmed
                        ? "✅ CONFIRMED"
                        : "⏳ WAITING"}
                </span>

            </div>

        </div>

        `;

    }).join("");

}

// ==================================
// INITIALIZE
// ==================================

scanStocks();

// Auto refresh every 60 seconds

setInterval(() => {

    if (!scanning) {
        scanStocks();
    }

}, 60000);

</script>

</body>
</html>
