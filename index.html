<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Trade India Scanner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080f1e;
    color: white;
    font-family: Arial, sans-serif;
    padding: 12px;
}

.header {
    background: #111d32;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid #263a58;
}

.header h2 {
    color: #00e5a0;
    font-size: 22px;
}

.header p {
    color: #aab7cc;
    margin-top: 8px;
    font-size: 13px;
}

.status {
    background: #17253c;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.status span {
    color: #00e5a0;
    font-weight: bold;
}

#lastScan {
    color: #aab7cc;
    margin-top: 8px;
    font-size: 12px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.card {
    background: #17253c;
    padding: 17px;
    border-radius: 12px;
}

.card p {
    color: #aab7cc;
    font-size: 12px;
}

.card h2 {
    margin-top: 10px;
    font-size: 25px;
}

.green { color: #00e5a0; }
.red { color: #ff5268; }
.blue { color: #46a6ff; }

button {
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.scanBtn {
    width: 100%;
    background: #00d99a;
    color: #071528;
    font-size: 16px;
    margin-bottom: 10px;
}

.refreshBtn {
    width: 100%;
    background: #2869d8;
    color: white;
    margin-bottom: 15px;
}

.tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 15px;
}

.tabs button {
    flex: 1;
    background: #17253c;
    color: white;
    font-size: 12px;
    padding: 12px 5px;
}

.tabs button.active {
    background: #00d99a;
    color: #071528;
}

.section {
    background: #111d32;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.section h3 {
    margin-bottom: 15px;
    color: #00e5a0;
}

.signal {
    background: #17253c;
    border-left: 4px solid #00e5a0;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 8px;
}

.signal.sell {
    border-left-color: #ff5268;
}

.signal h3 {
    margin-bottom: 8px;
    color: white;
}

.signal p {
    font-size: 13px;
    color: #b8c5d9;
    margin-top: 7px;
    line-height: 1.5;
}

.signal strong {
    color: white;
}

.loading {
    text-align: center;
    padding: 25px 10px;
    color: #00e5a0;
    line-height: 1.8;
}

.error {
    color: #ff5268;
    padding: 12px;
    font-size: 13px;
    line-height: 1.7;
}

.footer {
    text-align: center;
    color: #71829d;
    padding: 20px;
    font-size: 12px;
}

@media(min-width:700px) {
    body {
        max-width: 1100px;
        margin: auto;
    }

    .cards {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <h2>SMART TRADE INDIA</h2>
    <p>ORB + VOLUME + SMART MONEY SCANNER</p>
    <p>5 MINUTE CLOSED CANDLE</p>
</div>

<div class="status">
    SERVER STATUS:
    <span id="serverStatus">CHECKING...</span>
    <p id="lastScan">Last Scan: Not Started</p>
</div>

<div class="cards">

    <div class="card">
        <p>TOTAL STOCKS SCANNED</p>
        <h2 class="blue" id="totalStocks">0</h2>
    </div>

    <div class="card">
        <p>TOTAL SIGNALS</p>
        <h2 id="totalSignals">0</h2>
    </div>

    <div class="card">
        <p>BUY SIGNALS</p>
        <h2 class="green" id="buyCount">0</h2>
    </div>

    <div class="card">
        <p>SELL SIGNALS</p>
        <h2 class="red" id="sellCount">0</h2>
    </div>

</div>

<button class="scanBtn" id="scanButton" onclick="startScan()">
    START F&O SCANNER
</button>

<button class="refreshBtn" onclick="checkStatus()">
    REFRESH SERVER STATUS
</button>

<div class="tabs">

    <button class="active" onclick="showTab('ALL',this)">
        ALL
    </button>

    <button onclick="showTab('BUY',this)">
        BUY
    </button>

    <button onclick="showTab('SELL',this)">
        SELL
    </button>

    <button onclick="showTab('STRONG',this)">
        STRONG
    </button>

</div>

<div class="section">

    <h3>LIVE SCANNER RESULTS</h3>

    <div id="results">
        <div class="loading">
            Waiting for Scanner...
        </div>
    </div>

</div>

<div class="footer">
    SMART TRADE INDIA<br>
    ORB + VOLUME BREAKOUT SCANNER
</div>

<script>
    // ======================================
// SMART TRADE INDIA
// PART 2 - API CONNECTION
// ======================================

const API =
"https://smart-trade-backend-ig6l.onrender.com";

let allSignals = [];
let currentTab = "ALL";
let scanning = false;


// ======================================
// SERVER STATUS
// ======================================

async function checkStatus() {

    const status =
        document.getElementById("serverStatus");

    status.innerText = "CONNECTING...";

    const controller = new AbortController();

    const timer = setTimeout(() => {
        controller.abort();
    }, 90000);

    try {

        const response = await fetch(
            API + "/api/orb/status?t=" + Date.now(),
            {
                method: "GET",
                cache: "no-store",
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error("HTTP ERROR: " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("Invalid server response");
        }

        if (data.instrumentsLoaded) {

            status.innerText = "🟢 CONNECTED";

        } else {

            status.innerText = "🟡 MASTER NOT LOADED";

        }

        document.getElementById("totalStocks").innerText =
            data.totalFnoSymbols || 0;

    } catch (error) {

        if (error.name === "AbortError") {

            status.innerText = "🔴 SERVER TIMEOUT";

        } else if (error.message === "Failed to fetch") {

            status.innerText = "🔴 NETWORK / CORS ERROR";

        } else {

            status.innerText = "🔴 " + error.message;

        }

        console.error("STATUS ERROR:", error);

    } finally {

        clearTimeout(timer);

    }
}


// ======================================
// START F&O SCANNER
// ======================================

async function startScan() {

    if (scanning) return;

    scanning = true;

    const button =
        document.getElementById("scanButton");

    const results =
        document.getElementById("results");

    button.disabled = true;
    button.innerText = "SCANNING... PLEASE WAIT";

    results.innerHTML = `
        <div class="loading">
            SCANNER STARTED...<br>
            Loading NSE F&O Stocks...<br>
            Please Wait...
        </div>
    `;

    const controller = new AbortController();

    const timer = setTimeout(() => {
        controller.abort();
    }, 600000);

    try {

        const response = await fetch(
            API + "/api/orb/scan?type=FNO&refresh=1",
            {
                method: "GET",
                cache: "no-store",
                signal: controller.signal
            }
        );

        if (!response.ok) {

            throw new Error(
                "SCANNER API ERROR: " + response.status
            );

        }

        const data = await response.json();

        if (!data.success) {

            throw new Error(
                data.error || "SCAN FAILED"
            );

        }

        allSignals = Array.isArray(data.signals)
            ? data.signals
            : [];

        document.getElementById("totalStocks").innerText =
            data.totalScanned || 0;

        document.getElementById("totalSignals").innerText =
            allSignals.length;

        document.getElementById("buyCount").innerText =
            allSignals.filter(
                x => x.signal === "BUY"
            ).length;

        document.getElementById("sellCount").innerText =
            allSignals.filter(
                x => x.signal === "SELL"
            ).length;

        document.getElementById("lastScan").innerText =
            "Last Scan: " +
            (data.scanTime
                ? new Date(data.scanTime).toLocaleTimeString()
                : new Date().toLocaleTimeString());

        renderSignals();

    } catch (error) {

        let message = error.message;

        if (error.name === "AbortError") {
            message = "SCAN TIMEOUT. Server took too long.";
        }

        results.innerHTML = `
            <div class="error">
                SCANNER ERROR:<br>
                ${escapeHTML(message)}
            </div>
        `;

        console.error("SCAN ERROR:", error);

    } finally {

        clearTimeout(timer);

        scanning = false;

        button.disabled = false;
        button.innerText = "START F&O SCANNER";

    }
}


// ======================================
// TAB FILTER
// ======================================

function showTab(tab, button) {

    currentTab = tab;

    document.querySelectorAll(
        ".tabs button"
    ).forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    renderSignals();

}


// ======================================
// RENDER SIGNALS
// ======================================

function renderSignals() {

    const results =
        document.getElementById("results");

    let filtered = allSignals;

    if (currentTab === "BUY") {

        filtered = allSignals.filter(
            x => x.signal === "BUY"
        );

    }

    if (currentTab === "SELL") {

        filtered = allSignals.filter(
            x => x.signal === "SELL"
        );

    }

    if (currentTab === "STRONG") {

        filtered = allSignals.filter(
            x => x.smartMoney &&
            Number(x.smartMoney.score || 0) >= 80
        );

    }

    if (filtered.length === 0) {

        results.innerHTML = `
            <div class="loading">
                NO SIGNAL FOUND<br><br>
                Wait for next completed candle.
            </div>
        `;

        return;

    }

    results.innerHTML = filtered.map(stock => {

        const buy = stock.signal === "BUY";

        const cls = buy ? "" : "sell";

        const color = buy ? "green" : "red";

        const indicators = stock.indicators || {};
        const trade = stock.trade || {};
        const oi = stock.oi || {};
        const smart = stock.smartMoney || {};

        return `

        <div class="signal ${cls}">

            <h3>
                ${escapeHTML(stock.symbol || "-")}
                <span class="${color}">
                    ${escapeHTML(stock.signal || "-")}
                </span>
            </h3>

            <p>
                Strength:
                <strong>
                    ${escapeHTML(stock.strength || "-")}
                </strong>
            </p>

            <p>
                Price:
                <strong>
                    ₹${Number(stock.price || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                Smart Money Score:
                <strong>
                    ${Number(smart.score || 0)}
                </strong>
            </p>

            <p>
                RSI:
                <strong>
                    ${Number(indicators.rsi || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                ADX:
                <strong>
                    ${Number(indicators.adx || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                VWAP:
                <strong>
                    ₹${Number(indicators.vwap || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                Volume Ratio:
                <strong>
                    ${Number(indicators.volumeRatio || 0).toFixed(2)} X
                </strong>
            </p>

            <p>
                Futures OI Change:
                <strong>
                    ${Number(oi.oiChangePercent || 0).toFixed(2)}%
                </strong>
            </p>

            <p>
                OI Confirmation:
                <strong>
                    ${oi.pass ? "PASSED" : "NOT PASSED"}
                </strong>
            </p>

            <hr style="margin:12px 0;border-color:#35445d">

            <p>
                ENTRY:
                <strong>
                    ₹${Number(trade.entry || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                STOP LOSS:
                <strong class="red">
                    ₹${Number(trade.stopLoss || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                TARGET 1:
                <strong class="green">
                    ₹${Number(trade.target1 || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                TARGET 2:
                <strong class="green">
                    ₹${Number(trade.target2 || 0).toFixed(2)}
                </strong>
            </p>

            <p>
                Candle Time:
                ${escapeHTML(stock.candleTime || "-")}
            </p>

            <p>
                Timeframe: 5 MIN CLOSED CANDLE
            </p>

        </div>

        `;

    }).join("");

}


// ======================================
// HTML ESCAPE
// ======================================

function escapeHTML(value) {

    return String(value).replace(
        /[&<>"']/g,
        char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]
    );

}


// ======================================
// INITIALIZE
// ======================================

checkStatus();

setInterval(checkStatus, 60000);


// ======================================
// END
// ======================================

</script>
</body>
</html>
