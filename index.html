
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TRADE INDIA V12 PRO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:16px;
 background:#080f20;
 color:#f1f5f9;
 font-family:Arial,sans-serif;
}
header,.panel,.card{
 background:#19263d;
 border:1px solid #30435f;
 border-radius:20px;
 padding:18px;
 margin-bottom:16px;
}
h1{color:#42d9b4;font-size:27px}
h2{color:#42d9b4;font-size:23px}
button{
 border:0;border-radius:12px;
 padding:15px 20px;
 font-weight:bold;font-size:15px;
 color:white;background:#2478e8;
 margin:5px 3px;
}
#sound{background:#53647a}
#server{font-size:16px;line-height:1.7}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.card{margin:0;padding:14px}
.price{font-size:27px;font-weight:bold;margin:12px 0}
.status{
 display:inline-block;
 padding:7px 12px;
 border-radius:20px;
 background:#59451d;
 color:#ffda80;
 font-weight:bold;
 margin-bottom:12px;
}
.metrics{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.metric{
 background:#101c30;
 padding:11px;
 border-radius:12px;
 min-width:0;
 overflow-wrap:anywhere;
}
.metric small{color:#9eafc5}
.metric b{display:block;margin-top:6px;font-size:17px}
.checks{
 margin-top:12px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}
.check{
 background:#101c30;
 border-radius:9px;
 padding:9px;
 font-size:12px;
 overflow-wrap:anywhere;
}
.pass{color:#43d9ad}
.fail{color:#fa829b}
.signal{
 background:#702e3c;
 padding:17px;
 border-radius:12px;
 margin-top:10px;
 font-weight:bold;
}
.strong{background:#126b4d}
.muted{color:#a9b8cc}
@media(max-width:380px){
 body{padding:9px}
 .card{padding:10px}
 h1{font-size:23px}
 .price{font-size:22px}
}
</style>
</head>

<body>

<header>
<h1>SMART TRADE INDIA V12 PRO</h1>
<p>LIVE NSE INDEX OPTIONS SCANNER</p>
<p>NIFTY | BANKNIFTY | FINNIFTY | SENSEX</p>
</header>

<button onclick="loadDashboard()">REFRESH NOW</button>
<button id="sound" onclick="toggleSound()">SOUND OFF</button>

<div class="panel" id="server">
 <b style="color:#fa829b">● SERVER CONNECTING</b>
 <p>WAITING...</p>
</div>

<div class="panel">
 Last Scan: <b id="lastScan">--</b>
 <p>Next refresh: <b id="countdown">5</b> seconds</p>
</div>

<h2>LIVE INDEX PRICES</h2>
<div class="grid" id="indexes"></div>

<h2>VERY STRONG SELL SIGNALS</h2>
<div id="signals">
 <div class="signal">WAITING FOR SIGNALS</div>
</div>

<h2>SERVER INFORMATION</h2>
<div class="panel" id="info">Waiting for API...</div>

<script>
"use strict";

const API_URL =
"https://smart-trade-backend-ig6l.onrender.com/api/scan";

const INDEXES = [
 "NIFTY",
 "BANKNIFTY",
 "FINNIFTY",
 "SENSEX"
];

const CHECKS = [
 "trend",
 "vwap",
 "rsi",
 "macd",
 "volume",
 "oiPrice"
];

let soundOn = false;
let previousSignals = new Set();
let countdown = 5;
let busy = false;

const indexesDiv = document.getElementById("indexes");

function formatNumber(value) {
 const n = Number(value);
 if (!Number.isFinite(n)) return "--";
 return n.toLocaleString("en-IN", {
  maximumFractionDigits: 2
 });
}

function showCheckName(key) {
 const names = {
  trend:"Trend",
  vwap:"VWAP",
  rsi:"RSI",
  macd:"MACD",
  volume:"Volume",
  oiPrice:"OI + Price"
 };
 return names[key] || key;
}

function createCards() {
 indexesDiv.innerHTML = INDEXES.map(name => `
  <div class="card" id="card-${name}">
   <h2>${name}</h2>
   <div class="price" id="price-${name}">--</div>
   <span class="status" id="status-${name}">WAIT</span>

   <div class="metrics">
    <div class="metric">
     <small>RSI</small>
     <b id="rsi-${name}">--</b>
    </div>
    <div class="metric">
     <small>VWAP</small>
     <b id="vwap-${name}">--</b>
    </div>
    <div class="metric">
     <small>Volume Ratio</small>
     <b id="volume-${name}">--</b>
    </div>
    <div class="metric">
     <small>Futures OI Change</small>
     <b id="oi-${name}">--</b>
    </div>
    <div class="metric">
     <small>Bear Strength</small>
     <b id="bear-${name}">0/6</b>
    </div>
    <div class="metric">
     <small>Bull Strength</small>
     <b id="bull-${name}">0/6</b>
    </div>
   </div>

   <div class="checks" id="checks-${name}"></div>
   <div class="signal" id="signal-${name}">
    WAITING FOR DATA
   </div>
  </div>
 `).join("");
}

function setText(id,value) {
 const el = document.getElementById(id);
 if (el) el.textContent = value;
}

function countTrue(checks) {
 return CHECKS.filter(k => checks && checks[k] === true).length;
}

function renderIndex(name,item) {
 if (!item) {
  setText("price-"+name,"NO DATA");
  setText("status-"+name,"WAIT");
  setText("signal-"+name,"WAITING FOR DATA");
  return;
 }

 const price = item.underlyingPrice ??
               item.spotPrice ??
               item.price;

 setText("price-"+name,formatNumber(price));
 setText("rsi-"+name,formatNumber(item.rsi));
 setText("vwap-"+name,formatNumber(item.vwap));
 setText("volume-"+name,
  formatNumber(item.volumeMultiplier)+"x");
 setText("oi-"+name,
  formatNumber(item.oiChangePercent)+"%");

 const bear = item.peChecks || {};
 const bull = item.ceChecks || {};

 const bearCount = countTrue(bear);
 const bullCount = countTrue(bull);

 setText("bear-"+name,bearCount+"/6");
 setText("bull-"+name,bullCount+"/6");

 const status = item.status || "WAIT";
 setText("status-"+name,status);

 const checksHTML = CHECKS.map(key => {
  const ok = bear[key] === true;
  return `
   <div class="check ${ok ? "pass":"fail"}">
    ${ok ? "✓":"✕"} Bearish: ${showCheckName(key)}
   </div>`;
 }).join("");

 document.getElementById("checks-"+name).innerHTML =
  checksHTML;

 const strongSell = CHECKS.every(key => bear[key] === true);

 const signal = document.getElementById("signal-"+name);

 if (strongSell) {
  signal.className = "signal strong";
  signal.textContent = "VERY STRONG SELL - ALL 6 CONDITIONS";
 } else {
  signal.className = "signal";
  signal.textContent =
   "WAIT - Bearish conditions: "+bearCount+"/6";
 }
}

function renderSignals(results) {
 const active = [];

 INDEXES.forEach(name => {
  const item = results[name];
  if (!item || !item.peChecks) return;

  const checks = item.peChecks;
  const allTrue = CHECKS.every(k => checks[k] === true);

  if (allTrue) {
   active.push(name);
  }
 });

 const container = document.getElementById("signals");

 if (active.length === 0) {
  container.innerHTML =
   '<div class="signal">NO VERY STRONG SELL SIGNAL</div>';
 } else {
  container.innerHTML = active.map(name => `
   <div class="signal strong">
    VERY STRONG SELL: ${name}
    <br>ALL SIX CONDITIONS CONFIRMED
   </div>
  `).join("");
 }

 if (soundOn) {
  const newSignals = active.filter(
   name => !previousSignals.has(name)
  );

  if (newSignals.length > 0) playSound();
 }

 previousSignals = new Set(active);
}

function playSound() {
 try {
  const audio = new AudioContext();
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.frequency.value = 850;
  gain.gain.value = 0.15;
  oscillator.start();

  setTimeout(() => {
   oscillator.stop();
   audio.close();
  },400);
 } catch(e) {
  console.log("Sound unavailable",e);
 }
}

function toggleSound() {
 soundOn = !soundOn;
 document.getElementById("sound").textContent =
  soundOn ? "SOUND ON" : "SOUND OFF";

 if (soundOn) playSound();
}

async function loadDashboard() {
 if (busy) return;
 busy = true;

 try {
  const response = await fetch(API_URL,{
   method:"GET",
   cache:"no-store",
   headers:{"Accept":"application/json"}
  });

  if (!response.ok) {
   throw new Error("HTTP "+response.status);
  }

  const data = await response.json();

  if (data.status !== "SUCCESS" || !data.results) {
   throw new Error("Invalid scan response");
  }

  INDEXES.forEach(name => {
   renderIndex(name,data.results[name]);
  });

  renderSignals(data.results);

  document.getElementById("server").innerHTML =
   '<b class="pass">● SERVER CONNECTED</b><br>'+
   (data.version || "SMART TRADE INDIA");

  setText("lastScan",
   data.lastScanTime
    ? new Date(data.lastScanTime).toLocaleTimeString("en-IN")
    : "--"
  );

  setText("info",
   "HTTP 200 | API SUCCESS | Four Index Scan Active"
  );

 } catch(error) {
  document.getElementById("server").innerHTML =
   '<b style="color:#fa829b">● SERVER ERROR</b><br>'+
   error.message;

  setText("info",error.message);
  console.error("Dashboard Error:",error);

 } finally {
  busy = false;
 }
}

function startRefresh() {
 countdown = 5;

 setInterval(() => {
  countdown--;
  setText("countdown",Math.max(0,countdown));

  if (countdown <= 0) {
   countdown = 5;
   loadDashboard();
  }
 },1000);
}

createCards();
loadDashboard();
startRefresh();

</script>
</body>
</html>
