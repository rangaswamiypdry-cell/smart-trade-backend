<script>

// ==========================================
// SMART TRADE INDIA LIVE V4
// ==========================================

const API_BASE =
"https://smart-trade-backend-ig6l.onrender.com";

let stocks = [];
let quotes = {};
let scanData = null;

let autoEnabled = true;
let scanBusy = false;
let quoteBusy = false;


// ==========================================
// HELPERS
// ==========================================

function formatNumber(value) {

  if (value === null || value === undefined ||
      value === "") return "-";

  return Number(value).toLocaleString("en-IN", {
    maximumFractionDigits:2
  });

}

function price(value) {

  return value == null
    ? "-"
    : "₹" + formatNumber(value);

}

function setError(message) {

  document.getElementById("errorMessage").textContent =
    message || "";

}


// ==========================================
// SERVER STATUS
// ==========================================

async function loadStatus() {

  try {

    const response =
      await fetch(API_BASE + "/api/status");

    if (!response.ok) {
      throw new Error("Server error");
    }

    const data = await response.json();

    const connected =
      data.status === "OK" &&
      data.tokenConfigured &&
      data.masterLoaded;

    document.getElementById("serverStatus").textContent =
      connected ? "● SERVER LIVE" : "● CHECK CONFIGURATION";

    document.getElementById("total").textContent =
      data.fnoUnderlyingCount || 0;

    document.getElementById("message").textContent =
      "Upstox Token: " +
      (data.tokenConfigured ? "Connected" : "Missing");

  } catch(error) {

    document.getElementById("serverStatus").textContent =
      "SERVER ERROR";

    setError(error.message);

  }

}


// ==========================================
// LOAD NSE F&O STOCKS
// ==========================================

async function loadStocks() {

  try {

    const response =
      await fetch(API_BASE + "/api/fno-stocks");

    const data = await response.json();

    if (!response.ok ||
        data.status !== "SUCCESS") {

      throw new Error(data.message || "Stock loading failed");

    }

    stocks = data.stocks || [];

    document.getElementById("total").textContent =
      stocks.length;

    await loadLiveQuotes();

  } catch(error) {

    setError("Stock Error: " + error.message);

  }

}


// ==========================================
// LIVE QUOTES
// ==========================================

async function loadLiveQuotes() {

  if (quoteBusy || stocks.length === 0) return;

  quoteBusy = true;

  try {

    const keys = stocks
      .map(x => x.instrumentKey)
      .filter(Boolean);

    const query = encodeURIComponent(keys.join(","));

    const response = await fetch(
      API_BASE +
      "/api/market/live-quotes?instrument_keys=" +
      query
    );

    const result = await response.json();

    if (!response.ok || !result.success) {

      throw new Error(result.message || "Live quote failed");

    }

    quotes = result.data || {};

    document.getElementById("quoteUpdate").textContent =
      "Live Quote Updated: " +
      new Date().toLocaleTimeString();

    renderLiveStocks();

  } catch(error) {

    setError("Live Quote Error: " + error.message);

  } finally {

    quoteBusy = false;

  }

}


// ==========================================
// FIND QUOTE FOR STOCK
// ==========================================

function getQuote(stock) {

  const key = stock.instrumentKey;

  for (const [quoteKey, q] of Object.entries(quotes)) {

    if (
      quoteKey === key ||
      q.instrument_token === key ||
      q.symbol === stock.symbol
    ) {

      return q;

    }

  }

  return null;

}


// ==========================================
// LIVE STOCK TABLE
// ==========================================

function renderLiveStocks() {

  const tbody =
    document.getElementById("liveStocks");

  const search =
    document.getElementById("search")
      .value.toUpperCase();

  const filtered = stocks.filter(stock =>
    stock.symbol.toUpperCase().includes(search)
  );

  if (!filtered.length) {

    tbody.innerHTML =
      "<tr><td colspan='5'>No stocks found</td></tr>";

    return;

  }

  tbody.innerHTML = filtered.map(stock => {

    const q = getQuote(stock);

    const ohlc = q?.ohlc || {};

    const ltp =
      q?.last_price ?? q?.lastPrice ?? null;

    const change =
      q?.net_change ?? q?.netChange ?? null;

    const volume =
      q?.volume ?? q?.volume_traded ?? null;

    const oi = q?.oi ?? null;

    return `

      <tr>

        <td><b>${escapeHTML(stock.symbol)}</b></td>

        <td>${price(ltp)}</td>

        <td class="${Number(change) >= 0 ? "green" : "red"}">
          ${change == null ? "-" : formatNumber(change)}
        </td>

        <td>${formatNumber(volume)}</td>

        <td>${formatNumber(oi)}</td>

      </tr>

    `;

  }).join("");

}


// ==========================================
// SAFE HTML
// ==========================================

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"

  })[char]);

}


// ==========================================
// SCANNER
// ==========================================

async function startScan() {

  if (scanBusy) return;

  scanBusy = true;

  const button =
    document.getElementById("scanBtn");

  button.disabled = true;

  button.textContent = "SCANNING...";

  setError("Scanning completed 5-minute candles...");

  try {

    const response = await fetch(
      API_BASE + "/api/scan?force=true"
    );

    const data = await response.json();

    if (!response.ok ||
        data.status !== "SUCCESS") {

      throw new Error(data.message || "Scanner failed");

    }

    scanData = data;

    document.getElementById("buys").textContent =
      data.bullishCount || 0;

    document.getElementById("sells").textContent =
      data.bearishCount || 0;

    document.getElementById("waiting").textContent =
      data.waitingCount || 0;

    document.getElementById("lastUpdate").textContent =
      "Last Scan: " +
      new Date(data.updatedAt).toLocaleString();

    renderSignals();

    setError(
      "Scan Complete | API Errors: " +
      (data.errorCount || 0)
    );

  } catch(error) {

    setError("Scanner Error: " + error.message);

  } finally {

    scanBusy = false;

    button.disabled = false;

    button.textContent = "🔍 SCAN NOW";

  }

}


// ==========================================
// SIGNAL CARDS
// ==========================================

function createCard(stock, type) {

  const badge =
    type === "BUY" ? "buy" :
    type === "SELL" ? "sell" : "wait";

  return `

    <div class="stock">

      <div class="stock-head">

        <div class="stock-name">
          ${escapeHTML(stock.symbol || "UNKNOWN")}
        </div>

        <span class="badge ${badge}">
          ${type}
        </span>

      </div>

      <div class="stock-data">

        <div class="data-item">
          <small>PRICE</small>
          <strong>${price(stock.price)}</strong>
        </div>

        <div class="data-item">
          <small>RSI</small>
          <strong>${formatNumber(stock.rsi)}</strong>
        </div>

        <div class="data-item">
          <small>VOLUME RATIO</small>
          <strong>${formatNumber(stock.volumeRatio)}x</strong>
        </div>

        <div class="data-item">
          <small>VWAP</small>
          <strong>${price(stock.vwap)}</strong>
        </div>

        <div class="data-item">
          <small>FUTURES OI</small>
          <strong>${formatNumber(stock.futuresOI)}</strong>
        </div>

        <div class="data-item">
          <small>ENTRY</small>
          <strong>${price(stock.entry)}</strong>
        </div>

        <div class="data-item">
          <small>STOP LOSS</small>
          <strong>${price(stock.stopLoss)}</strong>
        </div>

        <div class="data-item">
          <small>TARGET 1</small>
          <strong>${price(stock.target1)}</strong>
        </div>

        <div class="data-item">
          <small>TARGET 2</small>
          <strong>${price(stock.target2)}</strong>
        </div>

      </div>

      <p class="muted">
        ${escapeHTML(stock.reason || "")}
      </p>

      <p class="muted">
        Candle: ${escapeHTML(stock.candleTime || "-")}
      </p>

    </div>

  `;

}


// ==========================================
// RENDER SIGNALS
// ==========================================

function renderSignals() {

  if (!scanData) return;

  const bullish = scanData.bullish || [];

  const bearish = scanData.bearish || [];

  const waiting = scanData.waiting || [];

  document.getElementById("bullishList").innerHTML =

    bullish.length

      ? bullish.map(x => createCard(x, "BUY")).join("")

      : '<div class="empty">No confirmed BUY signals</div>';

  document.getElementById("bearishList").innerHTML =

    bearish.length

      ? bearish.map(x => createCard(x, "SELL")).join("")

      : '<div class="empty">No confirmed SELL signals</div>';

  document.getElementById("waitingList").innerHTML =

    waiting.slice(0, 30).length

      ? waiting.slice(0, 30)
          .map(x => createCard(x, "WAIT"))
          .join("")

      : '<div class="empty">No waiting stocks</div>';

}


// ==========================================
// AUTO SCAN
// ==========================================

function toggleAuto() {

  autoEnabled = !autoEnabled;

  document.querySelector(".stop").textContent =
    autoEnabled ? "AUTO SCAN: ON" : "AUTO SCAN: OFF";

  document.getElementById("autoStatus").textContent =
    autoEnabled
      ? "Auto Scan Enabled"
      : "Auto Scan Disabled";

}


// ==========================================
// MARKET HOURS
// ==========================================

function isMarketOpen() {

  const now = new Date();

  const day = now.getDay();

  const minutes =
    now.getHours() * 60 + now.getMinutes();

  return (
    day >= 1 &&
    day <= 5 &&
    minutes >= 555 &&
    minutes <= 930
  );

}


// ==========================================
// AUTO REFRESH
// ==========================================

// Live quote refresh every 15 seconds.

setInterval(() => {

  if (isMarketOpen()) {

    loadLiveQuotes();

  }

}, 15000);


// Completed-candle scanner every 5 minutes.

setInterval(() => {

  if (autoEnabled && isMarketOpen()) {

    startScan();

  }

}, 300000);


// ==========================================
// START
// ==========================================

async function initialize() {

  await loadStatus();

  await loadStocks();

}

initialize();

</script>

</body>
</html>
